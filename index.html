"L8.1":{
 "title": "Eigenvectors and SVD",
 "min": 35,
 "viz": "svdviz",
 "why": "Eigenvectors and the SVD show up everywhere: PCA, compression, and the low-rank trick behind LoRA. They explain what a matrix really does.",
 "explain": [
  "A matrix usually turns and stretches a vector. An eigenvector is a special direction that it only stretches: A v = lambda v. The number lambda is the eigenvalue, the stretch factor. In the example the matrix [[2, 1], [1, 3]] has eigenvalues 1.382 and 3.618, and the check A v = lambda v is True for the second one.",
  "The singular value decomposition (SVD) works for any matrix, not only square ones. It writes M = U S V transposed, where U and V are rotations and S holds non-negative stretch factors (singular values) sorted from large to small. Read it as: rotate, stretch each axis by a different amount, rotate again.",
  "The big singular values carry most of the information. Keep only the top k and you get the best possible rank-k approximation of M. In the example a 6 by 6 matrix is built to be nearly rank 2, so its singular values are [4.81, 2.39, 0.13, 0.08, 0.06, 0.03]: two large, four tiny. Keeping 2 leaves an error of 0.164, which equals the square root of the sum of the squares of the dropped values. A rank-2 copy stores 26 numbers instead of 36, and for big matrices the saving is dramatic.",
  "This is why low-rank ideas keep appearing. PCA is the SVD of centred data. A LoRA adapter is a low-rank update. Compressing an embedding table with a smaller rank is the same move. If a weight change really is low rank, a thin pair of matrices captures it cheaply."
 ],
 "key": [
  "An eigenvector keeps its direction under A and only gets scaled by its eigenvalue.",
  "SVD: any matrix = rotate, stretch, rotate, with sorted stretch factors.",
  "Keeping the top k singular values gives the best rank-k approximation.",
  "Low-rank ideas power PCA, compression and LoRA."
 ],
 "code": "import numpy as np\nA = np.array([[2.0, 1.0], [1.0, 3.0]])\nvals, vecs = np.linalg.eigh(A)               # eigh is for symmetric matrices\nprint(vals.round(3).tolist())                # [1.382, 3.618]\nv = vecs[:, 1]\nprint(np.allclose(A @ v, vals[1] * v))       # True   A v = lambda v\n\nrng = np.random.default_rng(0)\nM = rng.normal(size=(6, 2)) @ rng.normal(size=(2, 6)) + 0.05 * rng.normal(size=(6, 6))   # nearly rank 2\nU, S, Vt = np.linalg.svd(M)\nprint(S.round(2).tolist())                   # two big values, the rest small\nfor k in (1, 2, 3):\n    Mk = (U[:, :k] * S[:k]) @ Vt[:k]\n    err = np.linalg.norm(M - Mk)\n    print(k, round(float(err), 3), round(float(np.sqrt((S[k:] ** 2).sum())), 3))   # error equals sqrt of the dropped squares\nprint(6 * 6, 2 * (6 + 6 + 1))                # 36 numbers vs 26 for a rank 2 copy (U, S and V for 2 components)\n\n# Output when run:\n# [1.382, 3.618]\n# True\n# [4.81, 2.39, 0.13, 0.08, 0.06, 0.03]\n# 1 2.394 2.394\n# 2 0.164 0.164\n# 3 0.105 0.105\n# 36 26",
 "out": "The eigen check is True. The six singular values show two large and four tiny, and the approximation error with 2 kept equals the root of the dropped squares (0.164).",
 "watch": [
  R8.strang,
  R8.dlb
 ],
 "check": [
  {
   "q": "What does it mean for v to be an eigenvector of A?",
   "a": "A v is just v scaled by a number, so A does not change its direction."
  },
  {
   "q": "Why are small singular values safe to drop?",
   "a": "They carry little of the matrix, so removing them changes it only a little. The error is the root of the sum of their squares."
  },
  {
   "q": "How is SVD related to LoRA?",
   "a": "LoRA assumes the weight change is low rank, which is the same idea as keeping only a few large singular values."
  }
 ],
 "ex": "Make a 50 by 50 matrix as the product of a 50 by 3 and a 3 by 50 random matrix plus a little noise. Plot or print its singular values and find the smallest k whose approximation error is under 5% of the matrix norm.",
 "teach": "Show a photo (as a matrix) rebuilt with 1, 5 and 20 singular values. Learners see compression directly."
},
"L8.2":{
 "title": "Backpropagation by hand",
 "min": 40,
 "viz": "backprop",
 "why": "Autograd hides backpropagation. Doing it once by hand shows what every framework computes and lets you debug gradients when they go wrong.",
 "explain": [
  "Backpropagation is the chain rule applied from the loss backward. Take a network with an input x of 2 values, a hidden layer of 3 tanh units, and one output, with mean squared error loss. Forward: z1 = x W1 + b1, h = tanh(z1), out = h W2 + b2, loss = mean((out - y)^2).",
  "Backward, one line per step. The loss gradient with respect to the output is 2 (out - y) / n. The gradient of W2 is h transposed times that. Pass the gradient back through W2 to get the gradient for h. Multiply by the derivative of tanh, which is 1 minus h squared, to get the gradient at z1. Then the gradient of W1 is x transposed times that. Every gradient has the same shape as its parameter, which is a good sanity check.",
  "Trust but verify. The example compares the hand-written gradients with PyTorch's autograd and both match (True and True). It also does a numeric gradient check: nudge one weight by a tiny amount in each direction and measure the change in loss. The numeric slope -0.004713 equals the analytic one. Gradient checking is the standard way to find a bug in a hand-written or custom backward pass.",
  "Notice what is being reused: the forward pass values (h, x) are needed on the way back, so training must store them. That stored memory is the activation memory you will meet again in the scaling lesson."
 ],
 "key": [
  "Backprop is the chain rule from the loss backwards, one local step at a time.",
  "Each gradient has the same shape as its parameter.",
  "Verify with a numeric gradient: (f(w+e) - f(w-e)) / 2e.",
  "Forward values must be stored for the backward pass."
 ],
 "code": "import numpy as np, torch\nrng = np.random.default_rng(0)\nx = rng.normal(size=(4, 2)); y = rng.normal(size=(4, 1))\nW1 = rng.normal(size=(2, 3)); b1 = np.zeros(3); W2 = rng.normal(size=(3, 1)); b2 = np.zeros(1)\n# forward\nz1 = x @ W1 + b1; h = np.tanh(z1); out = h @ W2 + b2\nloss = ((out - y) ** 2).mean()\n# backward, one line per step of the chain rule\nd_out = 2 * (out - y) / len(x)               # dL/d out\ndW2 = h.T @ d_out; db2 = d_out.sum(0)\nd_h = d_out @ W2.T\nd_z1 = d_h * (1 - h ** 2)                    # derivative of tanh\ndW1 = x.T @ d_z1; db1 = d_z1.sum(0)\nprint(round(float(loss), 4), dW1.shape, dW2.shape)\n# compare with autograd\nT = lambda a: torch.tensor(a, requires_grad=True)\ntW1, tb1, tW2, tb2 = T(W1), T(b1), T(W2), T(b2)\ntl = ((torch.tanh(torch.tensor(x) @ tW1 + tb1) @ tW2 + tb2 - torch.tensor(y)) ** 2).mean()\ntl.backward()\nprint(np.allclose(dW1, tW1.grad.numpy()), np.allclose(dW2, tW2.grad.numpy()))   # True True\n# numeric gradient check on one weight\ndef f(w):\n    W = W1.copy(); W[0, 0] = w\n    return (((np.tanh(x @ W + b1) @ W2 + b2) - y) ** 2).mean()\ne = 1e-6\nprint(round(float((f(W1[0, 0] + e) - f(W1[0, 0] - e)) / (2 * e)), 6), round(float(dW1[0, 0]), 6))\n\n# Output when run:\n# 0.6822 (2, 3) (3, 1)\n# True True\n# -0.004713 -0.004713",
 "out": "Hand-written gradients match autograd, and the numeric check gives -0.004713 for both the numeric and analytic gradient of one weight.",
 "watch": [
  R8.zth,
  R8.dlb
 ],
 "check": [
  {
   "q": "What is the derivative of tanh(z) in terms of h = tanh(z)?",
   "a": "1 - h squared."
  },
  {
   "q": "Why does the backward pass need stored forward values?",
   "a": "Local gradients such as 1 - h squared and x transposed use them, so training keeps the activations."
  },
  {
   "q": "How do you check a custom gradient is correct?",
   "a": "Compare it with a numeric gradient from small nudges to the parameter."
  }
 ],
 "ex": "Add a second hidden layer to the example, write its backward pass by hand, and confirm all gradients with autograd and a numeric check.",
 "teach": "Draw the network as a graph on the board and write one gradient on each edge going backward."
},
"L8.3":{
 "title": "Likelihood, cross-entropy and KL",
 "min": 35,
 "viz": "mle",
 "why": "Almost every loss in this course comes from one idea: choose the parameters that make the data most likely. Entropy and KL give you the language to compare distributions.",
 "explain": [
  "Maximum likelihood estimation (MLE) picks the parameters that make the observed data most probable. For a coin that gave 7 heads in 10 flips, the likelihood of a head-probability p is p^7 (1-p)^3. Searching over p finds the peak at 0.7, which is simply 7/10. Taking logs turns products into sums and is easier to optimise, so we maximise the log-likelihood.",
  "Cross-entropy loss is the negative log-likelihood of the right class. If the model's softmax gives the true class probability 0.786, the loss is -ln 0.786 = 0.241. A confident right answer gives a tiny loss and a confident wrong one a huge loss.",
  "Entropy measures uncertainty in bits: a fair coin has 1 bit and a 90/10 coin has 0.469 bits. KL divergence measures how far a model Q is from the truth P: KL(P||Q) = sum P log(P/Q). It is never negative, zero only if they match, and not symmetric: in the example KL(P||Q) is 0.0851 and KL(Q||P) is 0.092.",
  "The identity that ties it together: cross-entropy = entropy + KL. In the example both sides equal 0.8869. Since the entropy of the data is fixed, minimising cross-entropy is the same as minimising KL, which pulls the model's distribution toward the data. That is why language models trained on next-token cross-entropy learn the distribution of text, and why the same KL appears in distillation, RLHF and DPO."
 ],
 "key": [
  "MLE: choose the parameters that make the data most likely. Use logs.",
  "Cross-entropy = negative log-likelihood of the true class.",
  "KL(P||Q) is non-negative and not symmetric.",
  "Cross-entropy = entropy + KL, so minimising one minimises the gap."
 ],
 "code": "import numpy as np\n# maximum likelihood for a coin: 7 heads in 10 flips\nk, n = 7, 10\nps = np.linspace(0.01, 0.99, 99)\nll = k * np.log(ps) + (n - k) * np.log(1 - ps)\nprint(round(float(ps[ll.argmax()]), 2), k / n)           # 0.7 0.7\n# cross-entropy loss is the negative log-likelihood of the right class\nlogits = np.array([2.0, 0.5, -1.0]); p = np.exp(logits) / np.exp(logits).sum()\nprint(p.round(3).tolist(), round(float(-np.log(p[0])), 3))   # [0.786, 0.175, 0.039] 0.241\nH = lambda p: -(p * np.log2(p)).sum()\nprint(round(float(H(np.array([0.5, 0.5]))), 3), round(float(H(np.array([0.9, 0.1]))), 3))   # 1.0 0.469\nP = np.array([0.7, 0.2, 0.1]); Q = np.array([0.5, 0.3, 0.2])\nkl = lambda P, Q: float((P * np.log(P / Q)).sum())\nprint(round(kl(P, Q), 4), round(kl(Q, P), 4))            # 0.0851 0.092  not symmetric\nce = float(-(P * np.log(Q)).sum()); ent = float(-(P * np.log(P)).sum())\nprint(round(ce, 4), round(ent + kl(P, Q), 4))            # cross-entropy = entropy + KL\n\n# Output when run:\n# 0.7 0.7\n# [0.786, 0.175, 0.039] 0.241\n# 1.0 0.469\n# 0.0851 0.092\n# 0.8869 0.8869",
 "out": "MLE for the coin is 0.7. The class loss is 0.241. Entropy of a fair coin is 1.0 bit and of a 90/10 coin 0.469. KL values are 0.0851 and 0.092, and cross-entropy equals entropy plus KL (0.8869).",
 "watch": [
  R8.info,
  R8.dlb
 ],
 "check": [
  {
   "q": "A model assigns probability 0.5 to the true class. What is the cross-entropy loss?",
   "a": "-ln 0.5 = 0.693."
  },
  {
   "q": "Why is KL divergence not a distance?",
   "a": "It is not symmetric: KL(P||Q) differs from KL(Q||P)."
  },
  {
   "q": "Why does minimising cross-entropy fit the model to the data?",
   "a": "Because it equals the data's entropy plus the KL gap, and the entropy is fixed, so only the gap changes."
  }
 ],
 "ex": "Flip a biased coin in code 50 times, compute the MLE for p, and plot the log-likelihood curve. Then change to 5 flips and see how the peak gets less sharp.",
 "teach": "Ask learners to guess a coin's bias from 3 flips, then 300. The idea of likelihood becomes natural."
},
"L8.4":{
 "title": "Optimisers and schedules",
 "min": 40,
 "viz": "optim",
 "why": "Choosing and tuning the optimiser decides whether training works at all. Knowing what momentum, Adam and warmup do lets you fix a run that misbehaves.",
 "explain": [
  "Plain gradient descent goes downhill but zig-zags in a narrow valley. The example uses L = 0.5 (w1^2 + 25 w2^2), which is steep in w2 and shallow in w1. With a learning rate small enough to be stable in the steep direction, SGD crawls along the shallow one: it needs 155 steps to reach a loss below 0.001.",
  "Momentum keeps a running velocity, v = 0.9 v + gradient, and steps along it. Consistent directions build up speed and zig-zags cancel. Same learning rate, 66 steps. Adam keeps a running average of the gradient and of its square, divides one by the root of the other, and so scales each parameter's step separately. It starts with biased averages, so it applies a bias correction. It needs 70 steps here and is much less sensitive to the raw gradient scale.",
  "Learning-rate schedules matter as much. A common recipe is warmup then cosine decay: rise from 0 to the peak over the first steps (0.0005 at step 50, 0.001 at 100), then fall smoothly to a floor (0.000628 at 500, 0.0001 at 1000). Warmup avoids early blow-ups when Adam's averages are still rough, and decay lets the model settle.",
  "Gradient clipping rescales a gradient whose norm is too large. A gradient [3, 4] has norm 5, so clipping to 1 gives [0.6, 0.8]: same direction, safe size. These four tools, an optimiser such as AdamW, warmup and decay, clipping and sensible weight decay, are the standard recipe for training transformers."
 ],
 "key": [
  "Momentum smooths zig-zags. Adam scales each parameter's step.",
  "Adam corrects its biased early averages.",
  "Warmup then cosine decay is the standard schedule.",
  "Clip the gradient norm to prevent blow-ups."
 ],
 "code": "import numpy as np\ngrad = lambda w: np.array([w[0], 25 * w[1]])       # L = 0.5 (w1^2 + 25 w2^2), a narrow valley\nloss = lambda w: 0.5 * (w[0] ** 2 + 25 * w[1] ** 2)\ndef run(update, steps=1000):\n    w = np.array([5.0, 1.0]); st = {}\n    for t in range(1, steps + 1):\n        w = update(w, grad(w), st, t)\n        if loss(w) < 1e-3: return t\n    return None\ndef sgd(w, g, st, t, lr=0.03): return w - lr * g\ndef mom(w, g, st, t, lr=0.03, b=0.9):\n    st[\"v\"] = b * st.get(\"v\", 0) + g; return w - lr * st[\"v\"]\ndef adam(w, g, st, t, lr=0.3, b1=0.9, b2=0.999, eps=1e-8):\n    st[\"m\"] = b1 * st.get(\"m\", 0) + (1 - b1) * g; st[\"s\"] = b2 * st.get(\"s\", 0) + (1 - b2) * g * g\n    mh = st[\"m\"] / (1 - b1 ** t); sh = st[\"s\"] / (1 - b2 ** t)          # bias correction\n    return w - lr * mh / (np.sqrt(sh) + eps)\nprint(run(sgd), run(mom), run(adam))               # steps to reach loss below 0.001\nimport math\ndef lr_at(t, peak=1e-3, warm=100, total=1000, floor=1e-4):\n    if t < warm: return peak * t / warm\n    c = 0.5 * (1 + math.cos(math.pi * (t - warm) / (total - warm)))\n    return floor + (peak - floor) * c\nprint([round(lr_at(t), 6) for t in (0, 50, 100, 500, 1000)])\ng = np.array([3.0, 4.0]); clip = 1.0\nprint(np.linalg.norm(g), (g * min(1, clip / np.linalg.norm(g))).round(2).tolist())   # 5.0 [0.6 0.8]\n\n# Output when run:\n# 155 66 70\n# [0.0, 0.0005, 0.001, 0.000628, 0.0001]\n# 5.0 [0.6, 0.8]",
 "out": "On the narrow valley SGD takes 155 steps, momentum 66 and Adam 70. The schedule rises to 0.001 at step 100 and falls to 0.0001. Clipping turns a gradient of norm 5 into [0.6, 0.8].",
 "watch": [
  R8.adam,
  R8.sgdr
 ],
 "check": [
  {
   "q": "Why does SGD move slowly in a narrow valley?",
   "a": "The learning rate must be small for the steep direction, so progress along the shallow direction is slow."
  },
  {
   "q": "Why use warmup?",
   "a": "Early in training gradients and optimiser statistics are unreliable, so small first steps avoid instability."
  },
  {
   "q": "What does gradient clipping change?",
   "a": "The size of the gradient when it is too large, not its direction."
  }
 ],
 "ex": "Change the valley's steepness from 25 to 100 and rerun. Find the largest learning rate that keeps SGD stable and compare the step counts of the three methods.",
 "teach": "Let learners drag a ball down a bowl with different rules. The zig-zag and the speed-up are obvious."
},
"L8.5":{
 "title": "Training a tokenizer",
 "min": 35,
 "viz": "bpetrain",
 "why": "A model only sees token ids. Training your own tokenizer shows why vocabulary choices affect cost, speed and quality.",
 "explain": [
  "Byte pair encoding (BPE) starts from characters and repeatedly merges the most frequent adjacent pair into a new token. The example trains on a tiny corpus where newest appears 6 times and low 5. The first merges are e+s, es+t, est+_ (the word end marker) and l+o. After 8 merges the vocabulary has 9 distinct tokens.",
  "The learned merges apply to new words. The unseen word lowest is split as low + est_: it reuses pieces learned from low and newest. That is how a tokenizer handles words it never saw, and why real ones fall back to bytes so that any text can be encoded.",
  "Compression is the measure to watch. Here 7 characters become 2 tokens, 3.5 characters per token. Better compression means fewer tokens per document, so lower cost and more text in the context window. Real English tokenizers manage roughly 4 characters per token, but much less for other languages and for code, which makes those more expensive.",
  "Design choices: the vocabulary size (larger means shorter sequences but a bigger embedding table), the training text (it should look like what the model will see) and special tokens such as end of text. A tokenizer is fixed before training, and changing it later means starting the model again."
 ],
 "key": [
  "BPE repeatedly merges the most frequent adjacent pair.",
  "Learned merges split unseen words into known pieces.",
  "Characters per token measures compression and cost.",
  "Vocabulary size and training text are design choices fixed before training."
 ],
 "code": "from collections import Counter\ncorpus = \"low low low low low lower lower newest newest newest newest newest newest widest widest widest\"\nwords = [tuple(w) + (\"_\",) for w in corpus.split()]\nfreq = Counter(words)\ndef pairs(freq):\n    c = Counter()\n    for w, n in freq.items():\n        for a, b in zip(w, w[1:]): c[(a, b)] += n\n    return c\ndef merge(freq, pair):\n    out = Counter()\n    for w, n in freq.items():\n        new, i = [], 0\n        while i < len(w):\n            if i < len(w) - 1 and (w[i], w[i + 1]) == pair: new.append(w[i] + w[i + 1]); i += 2\n            else: new.append(w[i]); i += 1\n        out[tuple(new)] += n\n    return out\nmerges = []\nfor _ in range(8):\n    p = pairs(freq).most_common(1)[0]\n    merges.append(p[0]); freq = merge(freq, p[0])\nprint(merges[:4])    # [('w', 'e'), ('l', 'o'), ('lo', 'w'), ('e', 's')]\nprint(len(set(t for w in freq for t in w)))                    # vocabulary size after 8 merges\ndef encode(word, merges):\n    t = list(word) + [\"_\"]\n    for a, b in merges:\n        i = 0\n        while i < len(t) - 1:\n            if (t[i], t[i + 1]) == (a, b): t[i:i + 2] = [a + b]\n            else: i += 1\n    return t\nprint(encode(\"lowest\", merges))                                # a new word reuses learned pieces\nprint(round(len(\"lowest_\") / len(encode(\"lowest\", merges)), 2), \"characters per token\")\n\n# Output when run:\n# [('e', 's'), ('es', 't'), ('est', '_'), ('l', 'o')]\n# 9\n# ['low', 'est_']\n# 3.5 characters per token",
 "out": "The first merges are e+s, es+t, est+_ and l+o. After 8 merges there are 9 tokens, and lowest is split into low and est_, 3.5 characters per token.",
 "watch": [
  R8.zth,
  R8.nano
 ],
 "check": [
  {
   "q": "What does BPE merge at each step?",
   "a": "The most frequent pair of adjacent tokens, which becomes one new token."
  },
  {
   "q": "Why can a BPE tokenizer handle words it never saw?",
   "a": "It splits them into smaller learned pieces, down to characters or bytes."
  },
  {
   "q": "Why is a bigger vocabulary not always better?",
   "a": "It shortens sequences but makes the embedding and output layers larger, and rare tokens are poorly trained."
  }
 ],
 "ex": "Train the tokenizer on a paragraph of your own and print the first 10 merges. Check how many characters per token it achieves on a different paragraph.",
 "teach": "Have learners guess which pair gets merged first before running it."
},
"L8.6":{
 "title": "The training loop, properly",
 "min": 45,
 "viz": "trainloop",
 "why": "The training loop is where models are made. A good loop has a schedule, accumulation and clipping, and it checks itself.",
 "explain": [
  "The example trains a small character-level language model on a repeated sentence. The model reads the last 8 characters and predicts the next. Before any training the loss is 2.5, close to ln(V) = 2.6, the loss of guessing uniformly over the vocabulary. That is a useful sanity check: a fresh model should start near ln of the vocabulary size.",
  "The loop does the following each step: set the learning rate from the warmup and cosine schedule, run a few micro-batches, sum their scaled gradients (gradient accumulation), clip the gradient norm to 1.0, step AdamW, and zero the gradients. After 300 steps the loss on fresh samples is below 0.5, so the model has learned the pattern.",
  "Gradient accumulation lets you simulate a big batch on small memory. Four micro-batches of 16, each loss divided by 4, give the same gradient as one batch of 64. The example proves it: the two gradients match (True). Dividing by the number of micro-batches is the detail people forget.",
  "Mixed precision is the other standard tool. Keep weights in 32-bit but compute in 16-bit (bf16 or fp16) for speed and memory, and with fp16 scale the loss to avoid underflow. On a GPU in Colab you would add torch.autocast around the forward pass. It is shown here as a note and not run, since the example runs on a CPU. Always save checkpoints so a crash does not cost the whole run."
 ],
 "key": [
  "A fresh model should start near ln(vocabulary size).",
  "Loop: schedule, micro-batches, clip, AdamW step, zero grads.",
  "Accumulation: divide each micro-batch loss by the count.",
  "Use mixed precision on GPUs and save checkpoints."
 ],
 "code": "# For GPU training you would wrap the forward pass (not run here, this example uses a CPU):\n#   with torch.autocast(device_type='cuda', dtype=torch.bfloat16):\n#       loss = F.cross_entropy(model(x), y)\nimport math, torch, torch.nn as nn, torch.nn.functional as F\ntorch.manual_seed(0)\ntext = \"the cat sat on the mat. the dog sat on the log. \" * 40\nchars = sorted(set(text)); V = len(chars); idx = {c: i for i, c in enumerate(chars)}\ndata = torch.tensor([idx[c] for c in text]); ctx = 8\ndef batch(n):\n    ix = torch.randint(0, len(data) - ctx - 1, (n,))\n    return torch.stack([data[i:i + ctx] for i in ix]), data[ix + ctx]\nmodel = nn.Sequential(nn.Embedding(V, 16), nn.Flatten(), nn.Linear(16 * ctx, 64), nn.GELU(), nn.Linear(64, V))\nopt = torch.optim.AdamW(model.parameters(), lr=3e-3, weight_decay=0.01)\ntotal, warm, accum = 300, 20, 4\nfirst = None\nfor step in range(total):\n    lr = 3e-3 * (step + 1) / warm if step < warm else 3e-4 + 2.7e-3 * 0.5 * (1 + math.cos(math.pi * (step - warm) / (total - warm)))\n    for g in opt.param_groups: g[\"lr\"] = lr\n    for _ in range(accum):                           # gradient accumulation: 4 micro-batches of 16 = a batch of 64\n        x, y = batch(16)\n        loss = F.cross_entropy(model(x), y) / accum\n        loss.backward()\n    norm = torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)\n    opt.step(); opt.zero_grad()\n    if first is None: first = loss.item() * accum\nprint(round(first, 1), round(math.log(V), 1))        # starts near ln(V)\nx, y = batch(512)\nprint(F.cross_entropy(model(x), y).item() < 0.5)     # True   it has learned the pattern\n\n# accumulation equals a big batch (up to float error)\nxb, yb = batch(64); model.zero_grad()\nF.cross_entropy(model(xb), yb).backward(); g_big = model[-1].weight.grad.clone(); model.zero_grad()\nfor i in range(4): (F.cross_entropy(model(xb[i*16:(i+1)*16]), yb[i*16:(i+1)*16]) / 4).backward()\nprint(torch.allclose(g_big, model[-1].weight.grad, atol=1e-6))   # True\n\n# Output when run:\n# 2.5 2.6\n# True\n# True",
 "out": "The starting loss is 2.5 against ln(V) = 2.6, the final loss is below 0.5, and accumulating four micro-batches gives the same gradient as a batch of 64.",

"L8.7":{
 "title": "Evaluating a language model",
 "min": 35,
 "viz": "perplex",
 "why": "A falling training loss means little on its own. Validation loss, perplexity and the gap between them tell you whether the model is learning or memorising.",
 "explain": [
  "Perplexity is the exponential of the cross-entropy loss, and can be read as the effective number of choices the model is torn between. A model guessing uniformly over 50 tokens has perplexity 50. A loss of 2.0 nats means perplexity 7.39, about 2.89 bits per token.",
  "Always hold out validation text the model never trains on. In the example's made-up run, the training loss keeps falling (3.9 down to 0.3) while the validation loss bottoms out at 2.1 at checkpoint 3, then rises to 2.9. That is overfitting: the model is starting to memorise. Stop at the best validation point (perplexity 8.17) or add regularisation, more data or dropout. By the end the gap is 2.6.",
  "Be careful when comparing numbers. Per-token perplexity depends on the tokenizer: a model with a larger vocabulary has fewer, harder tokens. To compare across tokenizers, convert to bits per character. With 0.25 tokens per character, 2.0 nats per token is 0.721 bits per character.",
  "Also watch for contamination: if the evaluation text was in the training data, the score is inflated. And remember that low perplexity does not guarantee a useful assistant, so pair it with task evaluations from Layer 5."
 ],
 "key": [
  "Perplexity = exp(loss). It is the effective number of choices.",
  "Rising validation loss with falling training loss means overfitting.",
  "Compare across tokenizers with bits per character.",
  "Check for contamination and also evaluate on real tasks."
 ],
 "code": "import math\nV = 50\nprint(round(math.exp(math.log(V)), 1))               # 50.0   perplexity of a model that guesses uniformly\nloss = 2.0                                            # nats per token\nprint(round(math.exp(loss), 2), round(loss / math.log(2), 2))   # 7.39 perplexity, 2.89 bits per token\n# train and validation loss over training (made-up numbers showing overfitting)\ntrain = [3.9, 2.8, 2.0, 1.4, 0.9, 0.5, 0.3]\nval   = [3.9, 2.9, 2.3, 2.1, 2.2, 2.5, 2.9]\nbest = min(range(len(val)), key=val.__getitem__)\nprint(best, val[best], round(math.exp(val[best]), 2))   # 3 2.1 8.17  stop here\nprint(round(val[-1] - train[-1], 2))                  # 2.6   gap at the end\n# characters vs tokens: different tokenisers give different per-token perplexity\ntokens_per_char = {\"chars\": 1.0, \"bpe\": 0.25}\nbpc = 2.0 / math.log(2) * tokens_per_char[\"bpe\"]      # same model quality expressed per character\nprint(round(bpc, 3))                                   # 0.721 bits per character\n\n# Output when run:\n# 50.0\n# 7.39 2.89\n# 3 2.1 8.17\n# 2.6\n# 0.721",
 "out": "Uniform guessing over 50 tokens gives perplexity 50, a loss of 2.0 gives 7.39, and the best validation checkpoint is 3 with perplexity 8.17. The same quality is 0.721 bits per character.",
 "watch": [
  R8.info,
  R8.keshav
 ],
 "check": [
  {
   "q": "What is the perplexity of a loss of ln 20?",
   "a": "20."
  },
  {
   "q": "Training loss 0.3, validation loss 2.9. What is happening?",
   "a": "Overfitting: the model has memorised training data and does not generalise."
  },
  {
   "q": "Why can't you compare per-token perplexity between two tokenizers directly?",
   "a": "Tokens mean different amounts of text. Convert to bits per character."
  }
 ],
 "ex": "Take the training loop from the previous lesson and add a validation split. Print train and validation loss every 25 steps and find where they diverge when you shrink the training text.",
 "teach": "Ask learners why a model that memorised its homework gets a perfect training score and a bad exam."
},
"L8.8":{
 "title": "Scaling and compute",
 "min": 40,
 "viz": "scalecalc",
 "why": "Knowing how much compute and memory a training run needs tells you what is possible on your budget, and what is not.",
 "explain": [
  "Training a transformer costs roughly 6 x N x D floating-point operations, with N parameters and D training tokens. For 1 billion parameters on 20 billion tokens, that is 1.2e20 operations. Chinchilla-style results suggest about 20 tokens per parameter for compute-optimal training, so 7B parameters want about 140B tokens and 70B want 1,400B.",
  "Convert operations to time. An A100 does about 312 trillion bf16 operations per second at peak, but real training reaches maybe 40% of that (model FLOPs utilisation). That makes 1.2e20 operations about 11.1 GPU-days, or about 4 hours on 64 GPUs (0.17 days). A free Colab GPU is far slower and cannot hold a big model, so there you train small models.",
  "Memory comes before time. With AdamW in mixed precision you need about 16 bytes per parameter for weights, gradients and optimiser state: 16 GB for a 1B model, before activations. A checkpoint of fp32 weights alone is 4 GB for 1B parameters. A model that does not fit in memory cannot train at all, however long you wait.",
  "Use these numbers before spending money: estimate FLOPs, convert to GPU-hours at a realistic utilisation, check memory, and compare with a smaller model or fine-tuning. Prices change, so look up the current hourly cost of the GPU you plan to use."
 ],
 "key": [
  "Training compute is about 6 x parameters x tokens.",
  "About 20 tokens per parameter is the compute-optimal rule of thumb.",
  "Real GPUs reach roughly 40% of peak.",
  "Memory is about 16 bytes per parameter plus activations."
 ],
 "code": "N, D = 1e9, 20e9                                      # 1B parameters, 20B tokens (about 20 per parameter)\nflops = 6 * N * D\nprint(f\"{flops:.2e}\")                                 # 1.20e+20\na100_bf16 = 312e12; mfu = 0.4\nsecs = flops / (a100_bf16 * mfu)\nprint(round(secs / 86400, 1), \"GPU-days\")              # 11.1\nprint(round(secs / 86400 / 64, 2), \"days on 64 GPUs\")  # 0.17\nbytes_per_param = 16                                    # weights fp32 + grads + 2 Adam states, in mixed precision about 16\nprint(N * bytes_per_param / 1e9, \"GB before activations\")   # 16.0\nfor n in (1e9, 7e9, 70e9):\n    print(int(n / 1e9), \"B -> optimal tokens about\", int(20 * n / 1e9), \"B\")\nck = N * 4 / 1e9\nprint(ck, \"GB of fp32 weights per checkpoint\")        # 4.0\n\n# Output when run:\n# 1.20e+20\n# 11.1 GPU-days\n# 0.17 days on 64 GPUs\n# 16.0 GB before activations\n# 1 B -> optimal tokens about 20 B\n# 7 B -> optimal tokens about 140 B\n# 70 B -> optimal tokens about 1400 B\n# 4.0 GB of fp32 weights per checkpoint",
 "out": "1B parameters on 20B tokens is 1.2e20 FLOPs, about 11.1 GPU-days on an A100 at 40% utilisation, 0.17 days on 64 GPUs, and 16 GB for weights, gradients and optimiser state.",
 "watch": [
  R8.chin,
  R8.dlb
 ],
 "check": [
  {
   "q": "How many FLOPs does it take to train a 350M parameter model on 7B tokens?",
   "a": "6 x 3.5e8 x 7e9 = 1.47e19."
  },
  {
   "q": "Why use 40% rather than the GPU's peak speed?",
   "a": "Real training loses time to memory movement, communication and idle gaps."
  },
  {
   "q": "Why check memory before time?",
   "a": "If weights and optimiser state do not fit, the run cannot start."
  }
 ],
 "ex": "Estimate GPU-days and memory for a 125M parameter model on 2.5B tokens. Then see whether it could train on a free Colab GPU and how long it would take at 30% utilisation of a GPU you choose.",
 "teach": "Give each group a budget and a model size and ask whether it is feasible. They will find the limits fast."
},
"L8.9":{
 "title": "Distributed training basics",
 "min": 40,
 "viz": "parallel",
 "why": "Big models do not fit on one GPU. Knowing the basic ways to split the work helps you read training logs and choose tools.",
 "explain": [
  "Data parallelism puts a full copy of the model on each GPU and gives each a different slice of the batch. Each computes gradients on its slice, then the GPUs average them (an all-reduce) and everyone takes the same step. The example splits 32 samples across 4 workers and shows that the averaged gradients equal the big-batch gradient (True).",
  "The cost is communication. In a ring all-reduce each GPU sends and receives about 2 x (n-1)/n of the gradient size. For 7B parameters in fp16 with 8 GPUs that is 24.5 GB per GPU per step, which is why fast links between GPUs matter.",
  "But a full copy of a 7B model needs 112 GB per GPU with AdamW (16 bytes per parameter), which does not fit. ZeRO shards the state: stage 1 shards the optimiser state (38.5 GB per GPU on 8 GPUs), stage 2 also the gradients (26.2 GB), and stage 3 also the weights (14 GB). Fully sharded data parallel (FSDP) in PyTorch applies the same idea.",
  "Two other ideas: tensor parallelism splits individual matrix multiplies across GPUs, and pipeline parallelism puts different layers on different GPUs. In practice you use a library (Accelerate, DeepSpeed or PyTorch FSDP) and choose by memory fit. For learning, a single GPU and small models are enough, and you should understand the arithmetic before using the tools."
 ],
 "key": [
  "Data parallel: copy the model, split the batch, average gradients.",
  "All-reduce costs about 2 x (n-1)/n of the gradient size per GPU.",
  "ZeRO shards optimiser state, gradients and weights to save memory.",
  "Use libraries, but do the memory arithmetic first."
 ],
 "code": "import torch\ntorch.manual_seed(0)\nw = torch.randn(5, requires_grad=True); X = torch.randn(32, 5); y = torch.randn(32)\ndef g(Xs, ys):\n    w.grad = None; ((Xs @ w - ys) ** 2).mean().backward(); return w.grad.clone()\nfull = g(X, y)\nparts = [g(X[i*8:(i+1)*8], y[i*8:(i+1)*8]) for i in range(4)]     # 4 workers, 8 examples each\nprint(torch.allclose(full, sum(parts) / 4, atol=1e-6))              # True   averaged gradients = big batch\nn, params, by = 8, 7e9, 2\nprint(round(2 * (n - 1) / n * params * by / 1e9, 1), \"GB moved per GPU per step (ring all-reduce, fp16 grads)\")   # 24.5\nbase = 16 * params / 1e9\nprint(round(base, 1))                                                  # 112.0  GB per GPU with no sharding\nprint(round((2 + 2 + 12 / n) * params / 1e9, 1), round((2 + 14 / n) * params / 1e9, 1), round(16 / n * params / 1e9, 1))   # 38.5 26.2 14.0  ZeRO 1, 2, 3\n\n# Output when run:\n# True\n# 24.5 GB moved per GPU per step (ring all-reduce, fp16 grads)\n# 112.0\n# 38.5 26.2 14.0",
 "out": "Averaging gradients from 4 workers equals the big-batch gradient. Ring all-reduce moves 24.5 GB per GPU per step, and ZeRO stages 1, 2 and 3 need 38.5, 26.2 and 14 GB per GPU against 112 GB without sharding.",
 "watch": [
  R8.zero,
  R8.ddp
 ],
 "check": [
  {
   "q": "Why do data-parallel workers average gradients?",
   "a": "So every copy of the model takes the same step, as if it had processed the whole batch."
  },
  {
   "q": "What does ZeRO stage 3 shard?",
   "a": "The optimiser state, the gradients and the weights, so each GPU holds a slice."
  },
  {
   "q": "Name two other ways to split a model across GPUs.",
   "a": "Tensor parallelism (split matrix operations) and pipeline parallelism (split layers)."
  }
 ],
 "ex": "Compute per-GPU memory for a 13B model on 16 GPUs for baseline, ZeRO 1, 2 and 3 using the formulas. Say which would fit on 80 GB GPUs.",
 "teach": "Act it out: four learners each get part of a stack of homework to mark, then average their notes. That is data parallel."
},
"L8.10":{
 "title": "Reading a paper",
 "min": 35,
 "viz": "readpaper",
 "why": "The field moves through papers. You do not need to understand every line to get value, but you need a method.",
 "explain": [
  "Read in passes, as in Keshav's three-pass method. Pass one (10 minutes): title, abstract, figures and conclusion, to decide whether it is worth more time. Pass two: read the method and results, skipping proofs, and note what they claim. Pass three: only if needed, work through the details enough to reproduce it.",
  "Always extract the claim. Write one sentence: they did X, and showed Y, compared with Z. Check what the evidence is: which datasets, which baselines, how many runs. Be cautious when a gain is small, only one run is reported, or the baseline is weak.",
  "Verify one thing yourself. In the example, a famous claim from the attention paper is checked in code: dot products of random vectors have variance equal to the dimension. The measured variances are 4.0, 64.5 and 508.2 for dimensions 4, 64 and 512, and dividing by the square root of the dimension brings them back to about 1. Without that scaling, large scores make the softmax spiky (maximum weight 0.53 with unscaled scores against 0.27 with normal-scale scores).",
  "Keep notes: a short summary, the key figure, the one idea you can reuse and open questions. Start with a few well-known papers, then follow citations. Use code releases, such as nanoGPT, to see the idea running."
 ],
 "key": [
  "Read in passes. Decide early if it is worth your time.",
  "Write the claim in one sentence and check the evidence.",
  "Verify one small claim in code.",
  "Keep short notes with the reusable idea."
 ],
 "code": "import numpy as np\nrng = np.random.default_rng(0)\nfor dk in (4, 64, 512):\n    q = rng.normal(size=(20000, dk)); k = rng.normal(size=(20000, dk))\n    s = (q * k).sum(1)\n    print(dk, round(float(s.var()), 1), round(float((s / np.sqrt(dk)).var()), 2))\n# claim from the paper: dot products grow with d_k, so softmax saturates unless scaled\ndef sm(a): e = np.exp(a - a.max()); return e / e.sum()\na = rng.normal(size=8)\nprint(sm(a * 8).max().round(2), sm(a).max().round(2))        # unscaled big scores make a spiky softmax\n\n# Output when run:\n# 4 4.0 1.0\n# 64 64.5 1.01\n# 512 508.2 0.99\n# 0.53 0.27",
 "out": "The variance of a dot product is about d: 4.0, 64.5 and 508.2 for d = 4, 64 and 512. Dividing by the root of d gives variances near 1, and unscaled scores make the softmax much spikier.",
 "watch": [
  R8.keshav,
  R8.attn
 ],
 "check": [
  {
   "q": "What is the goal of the first pass?",
   "a": "To decide quickly whether the paper deserves more of your time."
  },
  {
   "q": "Why do attention scores get divided by the square root of d_k?",
   "a": "The variance of a dot product grows with d_k, so scaling keeps the softmax from saturating."
  },
  {
   "q": "What should make you cautious about a result?",
   "a": "A small gain, a single run, or a weak baseline."
  }
 ],
 "ex": "Pick a short paper from the references. Write the one-sentence claim, the evidence, and one thing you could check with ten lines of code. Then do the check.",
 "teach": "Run a paper club: each learner brings one claim and one doubt."
},
"L8.11":{
 "title": "Reproducing a result and fair comparisons",
 "min": 40,
 "viz": "ablate",
 "why": "Many apparent improvements are noise. Seeds, repeats and paired comparisons are how you tell a real gain from luck.",
 "explain": [
  "The same code with a different random seed gives a different result. To compare two settings you therefore need several runs. In the example, a simple linear model is trained with five seeds for each of two learning rates: mean validation errors are 0.264 (std 0.066) and 0.266 (std 0.07). The two sets of numbers overlap heavily.",
  "Use a paired comparison: run both settings on the same seeds, then look at the difference for each seed. The mean difference is -0.002 with a standard error of 0.002, which is no real difference. A single run could easily have shown one setting winning by a lot, and a blog post could have claimed a breakthrough.",
  "Reproducibility basics: set and record seeds, pin library versions, log the full configuration and the data version, and rerun to confirm that the same seed gives the same result (True in the example). An ablation changes one thing at a time to learn what matters: remove a component, or vary one setting, with everything else fixed.",
  "Report honestly: say how many runs, give the spread, and describe the baseline you tuned as carefully as your own method. If you tune only your own method, you are comparing a tuned model with an untuned one. This habit is what separates solid work from lucky work."
 ],
 "key": [
  "Different seeds give different results, so repeat runs.",
  "Compare paired runs on the same seeds.",
  "Record seeds, versions, data and configuration.",
  "Ablate one change at a time and tune baselines fairly."
 ],
 "code": "import numpy as np\ndef run(seed, lr, steps=60):\n    rng = np.random.default_rng(seed)\n    X = rng.normal(size=(200, 5)); w_true = np.array([1.0, -2.0, 0.5, 0.0, 3.0]); y = X @ w_true + rng.normal(0, 0.5, 200)\n    Xt, yt, Xv, yv = X[:150], y[:150], X[150:], y[150:]\n    w = rng.normal(size=5)\n    for _ in range(steps): w -= lr * 2 * Xt.T @ (Xt @ w - yt) / len(Xt)\n    return float(((Xv @ w - yv) ** 2).mean())\na = [run(s, 0.05) for s in range(5)]; b = [run(s, 0.1) for s in range(5)]\nprint(round(np.mean(a), 3), round(np.std(a), 3))\nprint(round(np.mean(b), 3), round(np.std(b), 3))\nd = np.array(a) - np.array(b)                                  # paired difference over the same seeds\nprint(round(float(d.mean()), 3), round(float(d.std() / np.sqrt(len(d))), 3))\nprint(run(0, 0.1) == run(0, 0.1))                              # True   same seed, same result\n\n# Output when run:\n# 0.264 0.066\n# 0.266 0.07\n# -0.002 0.002\n# True",
 "out": "Two learning rates give mean errors 0.264 and 0.266 over five seeds, a paired difference of -0.002 with a standard error of 0.002, so no real difference. The same seed gives the same result.",
 "watch": [
  R8.keshav,
  R8.attn
 ],
 "check": [
  {
   "q": "Why is one run per setting not enough?",
   "a": "Random seeds change results, so a gap might just be noise."
  },
  {
   "q": "What is a paired comparison?",
   "a": "Running both settings on the same seeds and analysing the difference per seed."
  },
  {
   "q": "What is an ablation?",
   "a": "Removing or changing one component at a time to see how much it matters."
  }
 ],
 "ex": "Compare two real settings of your own (for example two learning rates in the earlier training loop) over 10 seeds and report the mean, spread and paired difference. State what you can honestly conclude.",
 "teach": "Hand out dice and let learners claim a lucky die is better after one roll each. Then repeat 20 times."
},
"L8.12":{
 "title": "Your path from here",
 "min": 30,
 "viz": "roadmap",
 "why": "Finishing a course is not the goal. A realistic plan, a project and a habit of building in public are what keep you moving.",
 "explain": [
  "Layers 1 to 7 are about 50.5 hours of lesson time, and Layer 8 adds about 7.5 more. Allowing for exercises, notebooks and projects, plan on about 2.5 times that, around 126 hours. At 4 hours a week that is about 32 weeks, at 6 hours about 21, and at 10 hours about 13. These are estimates, so adjust after your first few weeks.",
  "You do not need every layer in order. The core path for building AI apps is Layers 1, 2, 5 and 6, about 29.2 hours of lessons, roughly 12 weeks at 6 hours a week. Add Layers 3 and 4 when you want to understand how models work inside, and Layer 8 when you want depth and rigour. Layer 7 is for when you want to teach.",
  "Make projects the spine. Each layer ends with a capstone. After Layer 2 build a tabular predictor, after Layer 5 a cited document assistant, after Layer 6 an on-device prototype. A public repository with a clear README and measured results is worth more than a certificate.",
  "Keep learning from primary sources: papers, the code of open projects, and course lectures. Join a community, share what you build, and teach what you learn. Your embedded Android background is an advantage: very few people can both build the model side and ship it onto real devices."
 ],
 "key": [
  "Estimate your hours honestly and plan weekly.",
  "The core path is Layers 1, 2, 5 and 6.",
  "Projects with measured results are the best proof of skill.",
  "Keep reading papers and code, and share what you build."
 ],
 "code": "mins = {'1': 435, '2': 410, '3': 460, '4': 465, '5': 485, '6': 425, '7': 350}                      # lesson minutes per layer in this course\ntotal_h = sum(mins.values()) / 60\nprint(round(total_h, 1), \"hours of lesson time\")\n# your own time is about 2.5x the lesson minutes once you do exercises and projects (assumed)\nfactor = 2.5\nfor per_week in (4, 6, 10):\n    print(per_week, \"h per week ->\", round(total_h * factor / per_week), \"weeks\")\ncore = sum(mins[k] for k in (\"1\", \"2\", \"5\", \"6\")) / 60\nprint(round(core, 1), \"hours for the core path (layers 1, 2, 5, 6)\")\nprint(round(core * factor / 6), \"weeks at 6 h per week\")\n\n# Output when run:\n# 50.5 hours of lesson time\n# 4 h per week -> 32 weeks\n# 6 h per week -> 21 weeks\n# 10 h per week -> 13 weeks\n# 29.2 hours for the core path (layers 1, 2, 5, 6)\n# 12 weeks at 6 h per week",
 "out": "Lesson time is 50.5 hours. At 2.5 times that, 4, 6 and 10 hours a week take 32, 21 and 13 weeks. The core path is 29.2 hours, about 12 weeks at 6 hours a week.",
 "watch": [
  R8.zth,
  R8.nano
 ],
 "check": [
  {
   "q": "Why multiply lesson minutes by 2.5?",
   "a": "Real learning includes exercises, experiments, rereading and projects, which take more time than the lesson itself."
  },
  {
   "q": "Which layers make the core path for building AI apps?",
   "a": "Layers 1, 2, 5 and 6."
  },
  {
   "q": "What is better evidence of skill than a certificate?",
   "a": "A public project with a clear README and measured results."
  }
 ],
 "ex": "Write your own plan: choose hours per week, pick the layers, set three project dates, and note what you will skip for now. Put it somewhere you will see it.",
 "teach": "End by having each learner state their next three steps and when they will do them."
}

/* 3. dot product and cosine */
VIZ.cosine={
 html:function(){

  '<p class="cap">Drag the tip of b, or use the slider. The dot product is biggest when the arrows agree and turns negative when they oppose. Cosine ignores arrow length.</p>';
 },
 init:function(h){
  var svg=h.querySelector("#v3"),rd=h.querySelector("#v3r"),sl=h.querySelector("#v3s");
  var CX=165,CY=115,U=70,ang=48,len=1.2,dragging=false;
  function draw(){
    var rad=ang*Math.PI/180,bx=len*Math.cos(rad),by=len*Math.sin(rad),ax=1.5;
    var dot=ax*bx,cosv=dot/(ax*len),phi=Math.acos(Math.max(-1,Math.min(1,cosv)))*180/Math.PI;
    var cls=cosv>0.03?"pos":(cosv<-0.03?"neg":"zero");
    var tax=CX+ax*U,tay=CY,tbx=CX+bx*U,tby=CY-by*U;
    var p=ang>180?ang-360:ang,pr=p*Math.PI/180,ex=CX+26*Math.cos(pr),ey=CY-26*Math.sin(pr);
    var s='<line class="axisl" x1="10" y1="'+CY+'" x2="320" y2="'+CY+'"/><line class="axisl" x1="'+CX+'" y1="8" x2="'+CX+'" y2="222"/>';
    s+='<circle class="ucirc" cx="'+CX+'" cy="'+CY+'" r="'+(1.5*U)+'"/>';
    if(Math.abs(p)>0.5)s+='<path class="arc" d="M'+(CX+26)+' '+CY+' A26 26 0 0 '+(p>0?0:1)+' '+ex.toFixed(1)+' '+ey.toFixed(1)+'"/>';
    s+=arrowSvg(CX,CY,tax,tay,"va","vaf")+'<text class="lab" x="'+(tax-4)+'" y="'+(tay-10)+'">a</text>';
    s+='<g class="'+cls+'">'+arrowSvg(CX,CY,tbx,tby,"vb","vbf");
    var ux=Math.cos(rad),uy=-Math.sin(rad);
    s+='<text class="lab" x="'+(tbx+ux*16-4).toFixed(1)+'" y="'+(tby+uy*16+4).toFixed(1)+'" style="fill:var(--c)">b</text>';
    s+='<circle class="hit" cx="'+tbx.toFixed(1)+'" cy="'+tby.toFixed(1)+'" r="20"/><circle class="handle" cx="'+tbx.toFixed(1)+'" cy="'+tby.toFixed(1)+'" r="6"/></g>';
    svg.innerHTML=s;
    rd.innerHTML='<span>angle '+Math.round(phi)+'°</span><span>cosine '+f2(cosv)+'</span><span>dot product '+f2(dot)+'</span>';
  }
  function fromPointer(e){
    var r=svg.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width*330,y=(e.clientY-r.top)/r.height*230;
    var vx=(x-CX)/U,vy=(CY-y)/U,l=Math.hypot(vx,vy);
    len=Math.max(0.25,Math.min(1.5,l));
    ang=(Math.atan2(vy,vx)*180/Math.PI+360)%360;
    sl.value=String(Math.round(ang));
    draw();
  }
  svg.style.touchAction="none";
  svg.addEventListener("pointerdown",function(e){dragging=true;try{svg.setPointerCapture(e.pointerId);}catch(x){}fromPointer(e);});
  svg.addEventListener("pointermove",function(e){if(dragging)fromPointer(e);});
  svg.addEventListener("pointerup",function(){dragging=false;});
  svg.addEventListener("pointercancel",function(){dragging=false;});
  sl.addEventListener("input",function(){ang=+sl.value;draw();});
  h.addEventListener("click",function(e){
    var b=e.target.closest("[data-v3]");if(!b)return;

  });

 }
};

/* 4. gradient descent */
VIZ.descent={
 html:function(){
  return '<svg id="v4" viewBox="0 0 330 200" role="img" aria-label="A bowl-shaped loss curve. A ball moves toward the minimum by gradient descent."></svg>'+
  '<div class="read" id="v4r"></div>'+
  '<div class="ctl"><label for="v4lr" class="rl" style="flex:none">Learning rate <b id="v4lrv">0.05</b></label><input id="v4lr" type="range" min="0.01" max="0.35" step="0.01" value="0.05"></div>'+
  '<div class="ctl"><button type="button" class="chip" data-v4="0.05">lr 0.05</button><button type="button" class="chip" data-v4="0.1">lr 0.10</button><button type="button" class="chip" data-v4="0.3">lr 0.30</button><button type="button" class="chip" data-v4="run">Run</button></div>'+
  '<p class="cap" id="v4cap">The curve is the loss from the lesson, (2w - 6)². The ball moves by w = w - lr × slope.</p>';
 },
 init:function(h){
  var svg=h.querySelector("#v4"),rd=h.querySelector("#v4r"),cap=h.querySelector("#v4cap"),lrIn=h.querySelector("#v4lr"),lrOut=h.querySelector("#v4lrv");
  var W0=-1,W1=7,L=28,R=322,T=10,Bm=176,LMAX=64;
  function X(w){return L+(w-W0)/(W1-W0)*(R-L);}
  function Y(l){return Math.max(T,Bm-Math.min(l,LMAX)/LMAX*(Bm-T));}
  function loss(w){return 4*(w-3)*(w-3);}
  var pts=[];for(var w=W0;w<=W1+0.001;w+=0.1)pts.push(X(w).toFixed(1)+","+Y(loss(w)).toFixed(1));
  var ticks='';[0,3,6].forEach(function(t){ticks+='<text class="vt" x="'+X(t)+'" y="192" text-anchor="middle">w = '+t+'</text>';});
  svg.innerHTML='<line class="axis" x1="'+L+'" y1="'+Bm+'" x2="'+R+'" y2="'+Bm+'"/>'+ticks+
    '<line class="minl" x1="'+X(3)+'" y1="'+T+'" x2="'+X(3)+'" y2="'+Bm+'"/><text class="vt" x="'+(X(3)+5)+'" y="24" style="fill:var(--ok)">minimum</text>'+
    '<polyline class="curve" points="'+pts.join(" ")+'"/><g id="v4t"></g><line class="tan" id="v4tan" x1="0" y1="0" x2="0" y2="0"/><g class="ball" id="v4ball"><circle r="7"/></g>';
  var trail=svg.querySelector("#v4t"),ball=svg.querySelector("#v4ball"),tan=svg.querySelector("#v4tan");
  var st={w:0,step:0,lr:0.05,timer:null};
  function clampW(w){return Math.max(W0,Math.min(W1,w));}
  function place(){
    var l=loss(st.w),cw=clampW(st.w),x=X(cw),y=Y(l),off=l>LMAX;
    ball.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px)";
    ball.setAttribute("class","ball"+(off?" warn":""));
    if(off){tan.style.opacity="0";}
    else{
      var g=8*st.w-24,m=-g*((Bm-T)/LMAX)/((R-L)/(W1-W0)),n=Math.hypot(1,m),dx=28/n,dy=28*m/n;
      tan.setAttribute("x1",(x-dx).toFixed(1));tan.setAttribute("y1",(y-dy).toFixed(1));
      tan.setAttribute("x2",(x+dx).toFixed(1));tan.setAttribute("y2",(y+dy).toFixed(1));
      tan.style.opacity="1";
    }
  }
  function readout(){
    var l=loss(st.w);
    rd.innerHTML='<span>lr '+st.lr.toFixed(2)+'</span><span>step '+st.step+'</span><span>w '+(Math.abs(st.w)>999?"huge":st.w.toFixed(2))+'</span><span>loss '+(l>9999?"huge":l.toFixed(2))+'</span>';
    if(l>LMAX){cap.textContent="Diverging. The steps overshoot the minimum and the loss grows each time.";}
    else if(st.step>0&&Math.abs(8*st.w-24)<0.05){cap.textContent="Converged. The slope is nearly flat, so the steps shrink to nothing.";}
    else if(st.step===0){cap.textContent="The curve is the loss from the lesson, (2w - 6)². The ball moves by w = w - lr × slope.";}
    else{cap.textContent="Each step moves against the slope. Steeper slope, bigger step.";}
  }
  function stopTimer(){if(st.timer){clearInterval(st.timer);st.timer=null;}}
  function addTrail(){
    var c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("class","tr");c.setAttribute("r","3");
    c.setAttribute("cx",X(clampW(st.w)).toFixed(1));c.setAttribute("cy",Y(loss(st.w)).toFixed(1));
    trail.appendChild(c);
  }
  function stepOnce(){addTrail();st.w=st.w-st.lr*(8*st.w-24);st.step++;place();readout();}
  function done(){return st.step>=24||Math.abs(8*st.w-24)<0.02;}
  function reset(){stopTimer();st.w=0;st.step=0;st.lr=+lrIn.value;trail.innerHTML="";place();readout();}
  function run(){
    reset();
    if(REDUCE){while(!done())stepOnce();return;}
    st.timer=setInterval(function(){stepOnce();if(done())stopTimer();},430);
    vizT.push(st.timer);
  }
  lrIn.addEventListener("input",function(){lrOut.textContent=(+lrIn.value).toFixed(2);reset();});
  h.addEventListener("click",function(e){
    var b=e.target.closest("[data-v4]");if(!b)return;
    var v=b.getAttribute("data-v4");
    if(v!=="run"){lrIn.value=v;lrOut.textContent=(+v).toFixed(2);}
    run();
  });
  place();readout();
  onVisible(svg,function(){later(run,300);});
 }
};

  '<div class="ctl"><button type="button" class="chip" data-v5s="play">Play</button><button type="button" class="chip" data-v5s="0" aria-pressed="false">Everyone</button><button type="button" class="chip" data-v5s="1" aria-pressed="false">Sick</button><button type="button" class="chip" data-v5s="2" aria-pressed="true">Positive tests</button></div>'+
  '<p class="cap">The test catches 99% of sick people and wrongly flags 5% of healthy people.</p>';
 },
 init:function(h){
  var svg=h.querySelector("#v5"),cap=h.querySelector("#v5cap"),prev=0.01,stage=2,N=1000,COLS=40,stats={s:10,tp:10,h:990,fp:50};
  var rnd=rng(7),ord=[],i,j,t;
  for(i=0;i<N;i++)ord.push(i);
  for(i=N-1;i>0;i--){j=Math.floor(rnd()*(i+1));t=ord[i];ord[i]=ord[j];ord[j]=t;}
  function say(){
    var x=stats;
    if(stage===0)cap.textContent=N.toLocaleString()+" people.";
    else if(stage===1)cap.textContent=x.s+" are sick. "+x.h+" are healthy.";
    else cap.textContent=(x.tp+x.fp)+" test positive. Only "+x.tp+" of them are sick: "+Math.round(100*x.tp/(x.tp+x.fp))+"%.";
  }
  function build(){
    var s=Math.max(1,Math.round(N*prev)),tp=Math.round(s*0.99),hh=N-s,fp=Math.round(hh*0.05),cls=new Array(N),k,g,c,out="";
    for(k=0;k<N;k++){
      g=ord[k];c="d";
      if(k<s)c+=" sk"+(k<tp?" ps":" ng");else c+=((k-s)<fp)?" ps":" ng";
      cls[g]=c;
    }
    for(g=0;g<N;g++)out+='<circle class="'+cls[g]+'" cx="'+(6+(g%COLS)*8)+'" cy="'+(6+Math.floor(g/COLS)*8)+'" r="3"/>';
    svg.innerHTML=out;
    stats={s:s,tp:tp,h:hh,fp:fp};
    say();
  }
  function setStage(n){stage=n;svg.setAttribute("class","s"+n);setPressed(h,"data-v5s",n);say();}
  function play(){
    setStage(0);
    if(REDUCE){setStage(2);return;}
    later(function(){setStage(1);},900);
    later(function(){setStage(2);},2300);
  }
  build();
  h.addEventListener("click",function(e){
    var p=e.target.closest("[data-v5p]");
    if(p){prev=+p.getAttribute("data-v5p");setPressed(h,"data-v5p",p.getAttribute("data-v5p"));build();return;}
    var s=e.target.closest("[data-v5s]");
    if(s){var v=s.getAttribute("data-v5s");if(v==="play")play();else setStage(+v);}
  });
  onVisible(svg,play);
 }
};

 html:function(){

 init:function(h){

   {k:"x[1, 2]",f:function(r,c){return r===1&&c===2;},view:false,shape:"()",why:"A single number is copied out, so y = 0 does not touch x."},
   {k:"x[0:2, 1:4]",f:function(r,c){return r<2&&c>=1&&c<4;},view:true,shape:"(2, 3)"},
   {k:"x[:, 3]",f:function(r,c){return c===3;},view:true,shape:"(4,)"},

  ];

 }

     "y = w2 × h = "+fmt1(N.y),

function edgeGeom(a,b){
  var ox0=Math.max(a.x,b.x),ox1=Math.min(a.x+a.w,b.x+b.w),pts,dir;
  if(ox1-ox0>4){
    var cx=(ox0+ox1)/2;
    if(b.y>=a.y+a.h){pts=[[cx,a.y+a.h],[cx,b.y]];dir=[0,1];}
    else{pts=[[cx,a.y],[cx,b.y+b.h]];dir=[0,-1];}
  }else{
    var ay=a.y+a.h/2,by=b.y+b.h/2,ax,bx,right=b.x>a.x;
    ax=right?a.x+a.w:a.x;bx=right?b.x:b.x+b.w;
    if(Math.abs(ay-by)<3)pts=[[ax,ay],[bx,by]];
    else{var mx=(ax+bx)/2;pts=[[ax,ay],[mx,ay],[mx,by],[bx,by]];}
    dir=[right?1:-1,0];
  }
  return {pts:pts,dir:dir};
}

    var pp=p.slice();pp[pp.length-1]=[last[0]-d[0]*hl,last[1]-d[1]*hl];

    var tip=last[0].toFixed(1)+","+last[1].toFixed(1),bx=last[0]-d[0]*hl,by=last[1]-d[1]*hl;
    var p1=(bx-d[1]*hw).toFixed(1)+","+(by+d[0]*hw).toFixed(1),p2=(bx+d[1]*hw).toFixed(1)+","+(by-d[0]*hw).toFixed(1);
    s+='<g class="fe rv'+(e.k?" "+e.k:"")+'" data-s="'+(e.at||b.at)+'"><path d="'+pathd+'"/><polygon points="'+tip+' '+p1+' '+p2+'"/></g>';
  });
  v.nodes.forEach(function(n){
    var lines=(Array.isArray(n.t)?n.t:[n.t]).slice(),sub=n.s,total=lines.length+(sub?1:0),lh=13,y0=n.y+n.h/2-((total-1)*lh)/2+4;

    function stop(){if(timer){clearInterval(timer);timer=null;}}

/* 20. a decision tree carving up the plane */
VIZ.tree=(function(){
 var pts=[],r=rng(21),i;
 for(i=0;i<44;i++){var x=r(),y=r(),c=(x>0.55&&y<0.62)?1:0;if(r()<0.1)c=1-c;pts.push({x:x,y:y,c:c});}
 function gini(a){var n=a.length;if(!n)return 0;var p=a.filter(function(q){return q.c===1;}).length/n;return 1-p*p-(1-p)*(1-p);}
 function build(a,b,d,maxd){
  var n1=a.filter(function(q){return q.c===1;}).length,node={b:b,d:d,n:a.length,maj:n1*2>=a.length?1:0,pure:n1===0||n1===a.length};
  node.maj=n1*2>a.length?1:0;
  if(node.pure||d>=maxd||a.length<2)return node;
  var best=null;
  ["x","y"].forEach(function(ax){
    var s=a.slice().sort(function(p,q){return p[ax]-q[ax];});
    for(var k=1;k<s.length;k++){
      if(s[k][ax]===s[k-1][ax])continue;
      var t=(s[k][ax]+s[k-1][ax])/2,l=s.slice(0,k),rr=s.slice(k),g=(l.length*gini(l)+rr.length*gini(rr))/s.length;
      if(!best||g<best.g)best={g:g,ax:ax,t:t};
    }
  });
  if(!best)return node;
  node.ax=best.ax;node.t=best.t;
  var lb=b.slice(),rb=b.slice();
  if(best.ax==="x"){lb[2]=best.t;rb[0]=best.t;}else{lb[3]=best.t;rb[1]=best.t;}
  node.l=build(a.filter(function(q){return q[best.ax]<best.t;}),lb,d+1,maxd);
  node.r=build(a.filter(function(q){return q[best.ax]>=best.t;}),rb,d+1,maxd);
  return node;
 }
 var root=build(pts,[0,0,1,1],0,8);
 return {
  html:function(){
   return zH(330,214,"Points of two classes and the rectangles a decision tree carves out as its depth grows.")+
    '<div class="ctl"><label for="zd" class="rl" style="flex:none">Max depth <b id="zdv">1</b></label><input id="zd" type="range" min="0" max="7" step="1" value="1"></div>'+
    zC([["play","Play"]])+'<p class="cap" id="zcap"></p>';
  },
  init:function(h){
   var svg=h.querySelector("#zs"),rd=h.querySelector("#zr"),cap=h.querySelector("#zcap"),sl=h.querySelector("#zd"),dv=h.querySelector("#zdv");
   var P=8,W=330-2*P,H=214-2*P;
   function X(v){return P+v*W;} function Y(v){return P+v*H;}
   var D=1,timer=null;
   function walk(n,fn){if(n.d>=D||!n.l){fn(n,true);return;}fn(n,false);walk(n.l,fn);walk(n.r,fn);}
   function paint(){
    var s='<rect class="plot" x="'+P+'" y="'+P+'" width="'+W+'" height="'+H+'" rx="6"/>',leaves=0,right=0,lines="";
    walk(root,function(n,leaf){
     if(leaf){
      leaves++;
      s+='<rect class="rg r'+n.maj+(n.d===D?" fresh":"")+'" x="'+X(n.b[0]).toFixed(1)+'" y="'+Y(n.b[1]).toFixed(1)+'" width="'+((n.b[2]-n.b[0])*W).toFixed(1)+'" height="'+((n.b[3]-n.b[1])*H).toFixed(1)+'"/>';
     }else{
      var x1,y1,x2,y2;
      if(n.ax==="x"){x1=x2=X(n.t);y1=Y(n.b[1]);y2=Y(n.b[3]);}else{y1=y2=Y(n.t);x1=X(n.b[0]);x2=X(n.b[2]);}
      lines+='<line class="sp'+(n.d===D-1?" fresh":"")+'" x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>';
     }
    });
    s+=lines;
    pts.forEach(function(p){
     var cx=X(p.x),cy=Y(p.y);
     s+=p.c===0?'<circle class="kp k0" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.2"/>':'<rect class="kp k1" x="'+(cx-4).toFixed(1)+'" y="'+(cy-4).toFixed(1)+'" width="8" height="8" rx="1.2"/>';
    });
    svg.innerHTML=s;
    var ok=0;pts.forEach(function(p){var n=root;while(n.d<D&&n.l)n=p[n.ax]<n.t?n.l:n.r;if(n.maj===p.c)ok++;});
    rd.innerHTML='<span>depth '+D+'</span><span>'+leaves+' regions</span><span>training accuracy '+(ok/pts.length*100).toFixed(0)+'%</span>';
    dv.textContent=D;sl.value=D;
    cap.textContent=D===0?"No questions yet: one region, so the tree just predicts the most common class.":(D<=2?"Each split asks one yes/no question about x or y. The shaded regions show what the tree predicts.":(D<=4?"Deeper trees add more questions and the accuracy climbs.":"Now the tree is carving tiny regions around single noisy points. Training accuracy is high but this is memorising, not learning."));
   }
   function stop(){if(timer){clearInterval(timer);timer=null;}}
   sl.addEventListener("input",function(){stop();D=Math.max(0,Math.min(7,Math.round(+sl.value)));paint();});
   zOn(h,function(){
    stop();D=0;paint();
    if(REDUCE){D=7;paint();return;}
    timer=setInterval(function(){D++;paint();if(D>=7)stop();},1100);vizT.push(timer);
   });
   paint();
   onVisible(svg,function(){later(function(){h.querySelector('[data-z="play"]').click();},300);});
  }
 };
})();

VIZ.optim=(function(){
 function run(kind){
  var w=[4,1],v=[0,0],m=[0,0],s=[0,0],path=[[4,1]];
  for(var t=1;t<=40;t++){
   var g=[w[0],25*w[1]];
   for(var i=0;i<2;i++){
    if(kind==="sgd")w[i]-=0.03*g[i];
    else if(kind==="mom"){v[i]=0.9*v[i]+g[i];w[i]-=0.03*v[i];}
    else{m[i]=0.9*m[i]+0.1*g[i];s[i]=0.999*s[i]+0.001*g[i]*g[i];w[i]-=0.3*(m[i]/(1-Math.pow(0.9,t)))/(Math.sqrt(s[i]/(1-Math.pow(0.999,t)))+1e-8);}
   }
   path.push([w[0],w[1]]);
  }
  return path;
 }

  LAYERS.forEach(function(l){
    var c=count(l);
    var m=app.querySelector('[data-lm="'+l.id+'"]');if(m)m.textContent=l.wk+" · "+c.d+"/"+c.n+(l.modules?" lessons":" topics");
    var b=app.querySelector('[data-lb="'+l.id+'"]');if(b)b.style.width=pct(c)+"%";
  });
  PROJECTS.forEach(function(p){
    var c=pcount(p);var m=app.querySelector('[data-pm="'+p.id+'"]');if(m)m.textContent=c.d+"/"+c.n+" steps";
  });
  var nx=document.getElementById("next");if(nx)nx.innerHTML=nextHTML();
}

document.addEventListener("change",function(e){
  var t=e.target;
  if(t.matches&&t.matches("input[data-id]")){
    if(t.checked)S.done[t.getAttribute("data-id")]=1;else delete S.done[t.getAttribute("data-id")];
    save();updateStats();
  }
});
document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="q"){lib.q=e.target.value;document.getElementById("rl").innerHTML=libListHTML();}
});
document.addEventListener("click",function(e){
  var tb=e.target.closest&&e.target.closest("[data-tab]");
  if(tb){tab=tb.getAttribute("data-tab");view=null;renderView();window.scrollTo(0,0);return;}
  var les=e.target.closest&&e.target.closest("[data-lesson]");
  if(les){lastY=window.scrollY;view={type:"lesson",id:les.getAttribute("data-lesson")};renderView();window.scrollTo(0,0);return;}
  var qz=e.target.closest&&e.target.closest("[data-quiz]");
  if(qz){lastY=window.scrollY;view={type:"quiz",id:qz.getAttribute("data-quiz")};renderView();window.scrollTo(0,0);return;}
  var gq=e.target.closest&&e.target.closest("[data-grade]");
  if(gq){gradeQuiz(gq);return;}
  var rq=e.target.closest&&e.target.closest("[data-retry]");
  if(rq){renderView();window.scrollTo(0,0);return;}
  var ts=e.target.closest&&e.target.closest("[data-test]");
  if(ts){lastY=window.scrollY;view={type:"test",layer:+ts.getAttribute("data-test")};renderView();window.scrollTo(0,0);return;}
  var go=e.target.closest&&e.target.closest("[data-go]");
  if(go){var gp=go.getAttribute("data-go").split(":");if(!view)lastY=window.scrollY;view=gp[0]==="test"?{type:"test",layer:+gp[1]}:(gp[0]==="quiz"?{type:"quiz",id:gp[1]}:{type:"lesson",id:gp[1]});renderView();window.scrollTo(0,0);return;}
  var bk=e.target.closest&&e.target.closest("[data-back]");
  if(bk){view=null;renderView();window.scrollTo(0,lastY);return;}
  var dn=e.target.closest&&e.target.closest("[data-done]");
  if(dn){var did=dn.getAttribute("data-done");if(S.done[did])delete S.done[did];else S.done[did]=1;save();updateStats();paintDone(dn,did);return;}
  var cp=e.target.closest&&e.target.closest("[data-copy]");
  if(cp){
    var codeEl=cp.closest(".code").querySelector("code");
    var okCopy=function(){cp.textContent="Copied";setTimeout(function(){cp.textContent="Copy";},1500);};
    var failCopy=function(){selectNode(codeEl);cp.textContent="Selected";setTimeout(function(){cp.textContent="Copy";},1500);};
    try{navigator.clipboard.writeText(codeEl.textContent).then(okCopy,failCopy);}catch(err){failCopy();}
    return;
  }
  var ch=e.target.closest&&e.target.closest("[data-kind]");
  if(ch){
    lib.k=ch.getAttribute("data-kind");
    var cs=document.querySelectorAll("#chips .chip");
    for(var i=0;i<cs.length;i++)cs[i].setAttribute("aria-pressed",String(cs[i].getAttribute("data-kind")===lib.k));
    document.getElementById("rl").innerHTML=libListHTML();
  }
});
document.addEventListener("toggle",function(e){
  var d=e.target;
  if(d&&d.getAttribute&&d.getAttribute("data-layer")){S.open[d.getAttribute("data-layer")]=d.open;save();}
},true);

var themeBtn=document.getElementById("theme");
function effDark(){
  var t=document.documentElement.getAttribute("data-theme");
  if(t)return t==="dark";
  return !!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function themeLabel(){themeBtn.textContent=effDark()?"Light mode":"Dark mode";}
if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
themeBtn.addEventListener("click",function(){
  S.theme=effDark()?"light":"dark";
  document.documentElement.setAttribute("data-theme",S.theme);
  save();themeLabel();
});

var h=(location.hash||"").replace("#","");
if(TABS.some(function(t){return t[0]===h;}))tab=h;
themeLabel();renderStack();renderStat();renderView();
})();
</script>
