<title>GenAI Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: one-column phone app. Sticky header carries a seven-layer progress stack, content switches by tab, tab bar sits at the bottom. */
:root{
  --bg:#F2F4F8;
  --surface:#FFFFFF;
  --surface2:#E7EBF3;
  --line:#D3D9E5;
  --fg:#141A26;
  --muted:#586479;
  --accent:#2B50E6;
  --accent-fg:#FFFFFF;
  --accent-soft:#E2E8FF;
  --ok:#177A4B;
  --warn:#C2410C;
  --warn-soft:#FDE9DD;
  --ok-soft:#DCF2E5;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131C;--surface:#161C28;--surface2:#212A3B;--line:#2B3548;--fg:#E7ECF5;--muted:#9AA6BB;
    --accent:#86A0FF;--accent-fg:#0E131C;--accent-soft:#1B2646;--ok:#5FD09A;--warn:#FF9A62;--warn-soft:#3A2418;--ok-soft:#14302A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131C;--surface:#161C28;--surface2:#212A3B;--line:#2B3548;--fg:#E7ECF5;--muted:#9AA6BB;
  --accent:#86A0FF;--accent-fg:#0E131C;--accent-soft:#1B2646;--ok:#5FD09A;--warn:#FF9A62;--warn-soft:#3A2418;--ok-soft:#14302A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.gutter{max-width:712px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .gutter{padding-block:12px 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:700 22px/1.1 var(--font-display);letter-spacing:-.01em;margin:0}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:34px;font:500 12px var(--font-mono);cursor:pointer;color:var(--muted)}
.stack{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.seg{display:flex;flex-direction:column;gap:3px;min-width:0}
.bar-track{height:6px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent)}
.seg b{font:500 10px var(--font-mono);color:var(--muted);letter-spacing:.04em}
.stat{margin:8px 0 0;font-size:12px;color:var(--muted)}

main{padding-block:16px 112px}
h2{font:700 20px/1.2 var(--font-display);margin:0 0 4px;text-wrap:balance}
.lede{margin:0 0 16px;color:var(--muted);font-size:14px;max-width:62ch}
.tag{font:500 10.5px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap;flex:none}

/* next up */
.next{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;margin-bottom:16px}
.next .k{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.next .t{font:600 17px/1.3 var(--font-display)}
.next .l{font-size:13px;color:var(--muted)}

/* layers */
.layer{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.layer summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;column-gap:12px;align-items:center;padding:12px 14px 10px;min-height:56px}
.layer summary::-webkit-details-marker{display:none}
.lnum{font:500 13px var(--font-mono);color:var(--accent)}
.lname{font:600 16px/1.25 var(--font-display);min-width:0}
.lmeta{display:block;font:400 12px var(--font-mono);color:var(--muted);margin-top:2px}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 3px 0}
.layer[open] .chev{transform:rotate(-135deg);margin:3px 4px 0 0}
.lbar{grid-column:1/-1;height:3px;background:var(--surface2);margin-top:10px;border-radius:2px;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--ok)}
.lbody{padding:0 14px 14px}
.out{margin:4px 0 8px;font-size:14px;color:var(--muted)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;min-height:44px;cursor:pointer;border-top:1px solid var(--line)}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.chk span{min-width:0;overflow-wrap:anywhere}
.chk input:checked + span{color:var(--muted)}
.sub{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.res{display:flex;align-items:center;gap:10px;padding:10px 0;min-height:44px;text-decoration:none;border-top:1px solid var(--line)}
.res .rt{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.res small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.res .ext{color:var(--accent);font-family:var(--font-mono);flex:none}
.res:hover .rt{text-decoration:underline;text-underline-offset:3px}

/* projects */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.card h3{font:600 17px/1.25 var(--font-display);margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.card p{margin:6px 0;font-size:14px}
.card .gain{color:var(--muted)}
.card .gain b{color:var(--fg);font-weight:600}

/* teach */
.qrow{padding:12px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qhead{display:flex;gap:10px;align-items:baseline}
.qhead .lnum{flex:none}
.qrow details{margin:8px 0 0}
.qrow summary{cursor:pointer;font:500 13px var(--font-mono);color:var(--accent);min-height:32px;display:flex;align-items:center}
.qrow details p{margin:4px 0 0;padding:10px 12px;background:var(--surface2);border-radius:6px;font-size:14px}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:rung}
.ladder li{counter-increment:rung;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px 12px 48px;position:relative}
.ladder li::before{content:counter(rung);position:absolute;left:14px;top:12px;font:500 15px var(--font-mono);color:var(--accent)}
.ladder b{font:600 16px var(--font-display);display:block}
.ladder p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.ladder p strong{color:var(--fg);font-weight:600}
.gap{height:24px}

/* library */
.search{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit}
.search::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.deep{border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:2px 12px;margin-top:4px}.deep summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent)}.deep p{margin:0 0 10px;max-width:62ch}.deep .bigbtn{margin-bottom:12px}.builds{font-size:13px;color:var(--muted);margin:0 0 10px}.builds button{display:block;text-align:left;background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;min-height:32px;padding:0 6px 0 0}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:34px;font:500 12px var(--font-mono);cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.rlist{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 14px}
.rlist .res:first-child{border-top:0}
.rl{font:400 11px var(--font-mono);color:var(--muted)}
.empty{padding:20px 0;color:var(--muted);font-size:14px}
.note{margin:12px 0 0;font-size:12px;color:var(--muted)}

/* visualizations */
.bar-track i,.lbar i{transition:width .5s ease}
.viz{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px}
.viz svg{display:block;width:100%;height:auto}
.viz .ctl{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:10px}
.viz .read{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:8px;font:500 12px var(--font-mono)}
.viz .cap{margin:8px 0 0;font-size:13px;color:var(--muted)}
.viz input[type=range]{flex:1;min-width:140px;height:32px;accent-color:var(--accent)}
.viz .rl b{color:var(--fg);font-weight:500}
.viz .nt *{transition:none!important}
.vt{font:500 10px var(--font-mono);fill:var(--muted)}
.op{font:600 16px var(--font-mono);fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.cell{fill:var(--surface2);stroke:var(--line)}
.cv{font:500 11px var(--font-mono);fill:var(--fg);text-anchor:middle;dominant-baseline:central}
.acc .cell{fill:var(--accent-soft);stroke:var(--accent)}
.res .cell{fill:var(--accent);stroke:var(--accent)}
.res .cv{fill:var(--accent-fg)}
.bad .cell{fill:none;stroke:var(--warn);stroke-dasharray:3 2}
.bad .cv{fill:var(--warn)}
.ghost{opacity:0;transform:translateY(-27px);transition:transform .8s cubic-bezier(.3,.7,.2,1) .3s,opacity .5s .3s}
.go .ghost{opacity:.65;transform:translateY(0)}
.rc{opacity:0;transition:opacity .45s}
.go .rc{opacity:1}
.sc{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.sc rect{fill:var(--surface2);stroke:var(--line)}
.sc text{font:500 11px var(--font-mono);fill:var(--fg);dominant-baseline:central}
.sc .amt{text-anchor:end}
.k0 rect{fill:var(--accent-soft);stroke:var(--accent)}
.k1 rect{fill:var(--warn-soft);stroke:var(--warn)}
.k2 rect{fill:var(--ok-soft);stroke:var(--ok)}
.bkt{opacity:0;transition:opacity .5s .25s}
.grp .bkt{opacity:1}
.bkt rect{fill:none;stroke:var(--line);stroke-dasharray:4 3}
.bkt text{font:600 12px var(--font-body);fill:var(--fg);text-anchor:middle}
.bkt .mean{font:500 12px var(--font-mono);fill:var(--accent)}
.hint{transition:opacity .3s}
.grp .hint{opacity:0}
.axisl{stroke:var(--line);stroke-width:1}
.ucirc{fill:none;stroke:var(--line);stroke-dasharray:3 4}
.va{stroke:var(--fg);stroke-width:3;stroke-linecap:round}
.vaf{fill:var(--fg)}
.pos{--c:var(--ok)}
.neg{--c:var(--warn)}
.zero{--c:var(--muted)}
.vb{stroke:var(--c);stroke-width:3;stroke-linecap:round}
.vbf{fill:var(--c)}
.arc{fill:none;stroke:var(--muted);stroke-width:1.5}
.handle{fill:var(--c);stroke:var(--surface);stroke-width:2;cursor:grab}
.hit{fill:transparent;cursor:grab}
.lab{font:600 13px var(--font-display);fill:var(--fg)}
.axis{stroke:var(--line);stroke-width:1}
.curve{fill:none;stroke:var(--accent);stroke-width:2.5}
.minl{stroke:var(--ok);stroke-dasharray:3 4;stroke-width:1}
.tan{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3;transition:opacity .3s}
.ball{transition:transform .38s cubic-bezier(.3,.7,.2,1)}
.ball circle{fill:var(--fg);stroke:var(--surface);stroke-width:2;transition:fill .3s}
.ball.warn circle{fill:var(--warn)}
.tr{fill:var(--accent);opacity:.45}
.d{fill:var(--surface2);stroke:var(--line);stroke-width:.6;transition:fill .5s,opacity .5s,stroke .4s,stroke-width .3s}
.s1 .d.sk,.s2 .d.sk{fill:var(--warn)}
.s2 .d.ng{opacity:.2}
.s2 .d.ps{stroke:var(--accent);stroke-width:1.6}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--surface2);border:1px solid var(--line)}
.sw.w{background:var(--warn);border-color:var(--warn)}
.sw.p{background:none;border:2px solid var(--accent)}

/* lessons */
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;min-height:56px;cursor:pointer}
.lrow .dot{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;flex:none;display:grid;place-items:center;font:600 12px/1 var(--font-body)}
.lrow.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.lrow .lt{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.lrow small{display:block;font:400 12px var(--font-mono);color:var(--muted);margin-top:1px}
.lrow .ext{font-size:20px;line-height:1}
.crumb{background:none;border:0;padding:6px 0;min-height:40px;font:500 13px var(--font-mono);color:var(--accent);cursor:pointer;text-align:left}
.lmeta2{font:400 12px var(--font-mono);color:var(--muted);margin:2px 0 6px}
.lesson-title{font:700 25px/1.2 var(--font-display);margin:0 0 12px;text-wrap:balance}
.why{padding:12px 14px;background:var(--accent-soft);border-radius:8px;margin:0;font-size:14px}
.lsec{margin-top:26px}
.lsec h3{font:500 12px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.prose p{margin:0 0 12px;max-width:62ch}
.keys{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.keys li{padding-left:2px}
.code{border:1px solid var(--line);border-radius:8px;background:var(--surface2);overflow:hidden}
.codehead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 12px;border-bottom:1px solid var(--line);font:500 11px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.code pre{margin:0;padding:12px;overflow-x:auto;font:400 12.5px/1.55 var(--font-mono);color:var(--fg);tab-size:4}
.code code{font:inherit}
.codenote{margin:8px 0 0;font-size:13px;color:var(--muted)}
.tip{margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.bigbtn{width:100%;min-height:48px;padding:10px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font:600 15px var(--font-body);cursor:pointer;text-align:center}
.bigbtn.alt{background:none;color:var(--accent)}
.bullets{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:62ch}

/* more animations */
.sq rect{transition:fill .3s,stroke .3s}
.sq.on rect{fill:var(--accent-soft);stroke:var(--accent)}
.sq.chg rect{fill:var(--warn-soft);stroke:var(--warn)}
.sq.on.chg rect{fill:var(--warn-soft);stroke:var(--warn)}
.mc rect{transition:fill .3s,stroke .3s}
.mc.ra rect{fill:var(--accent-soft);stroke:var(--accent)}
.mc.cb rect{fill:var(--ok-soft);stroke:var(--ok)}
.mc.cc rect{fill:var(--accent);stroke:var(--accent)}
.mc.cc text{fill:var(--accent-fg)}
.eq{font:500 12px var(--font-mono);fill:var(--fg)}
.nbox{fill:var(--surface2);stroke:var(--line)}
.nval{font:600 13px var(--font-mono);fill:var(--fg)}
.gbox{fill:var(--warn-soft);stroke:var(--warn)}
.gval{font:600 12px var(--font-mono);fill:var(--warn)}
.rv{opacity:0;transition:opacity .45s}
.rv.on{opacity:1}
.plot{fill:var(--bg);stroke:var(--line)}
.kp{transition:stroke .25s,stroke-width .25s}
.kp.k0{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.kp.k1{fill:var(--warn);stroke:var(--surface);stroke-width:1.5}
.kp.nb{stroke:var(--fg);stroke-width:2.5}
.nl{stroke:var(--muted);stroke-width:1}
.kring{fill:none;stroke:var(--muted);stroke-dasharray:4 4}
.qd{transition:transform .2s;pointer-events:none}
.qd polygon{fill:var(--fg);stroke:var(--surface);stroke-width:3}
.qd.w0 polygon{stroke:var(--accent)}
.qd.w1 polygon{stroke:var(--warn)}
.tru{fill:none;stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1.5}
.fit{fill:none;stroke:var(--accent);stroke-width:2.5}
.dp{fill:var(--fg);stroke:var(--surface);stroke-width:1.5}
.bt{fill:var(--accent)}
.bt.bw{fill:var(--warn)}
.zone{fill:var(--accent-soft);opacity:.6}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.tl{stroke:var(--fg);stroke-width:2}
.pd{transition:fill .3s,stroke .3s;stroke-width:2}
.pd.tp{fill:var(--accent);stroke:var(--accent)}
.pd.fn{fill:var(--surface);stroke:var(--warn)}
.pd.fp{fill:var(--warn);stroke:var(--warn)}
.pd.tn{fill:var(--surface2);stroke:var(--line)}
.sw.tpc{background:var(--accent);border-color:var(--accent)}
.sw.fpc{background:var(--warn);border-color:var(--warn)}
.sw.fnc{background:none;border:2px solid var(--warn)}

/* diagrams and more animations */
.fnode rect{fill:var(--surface2);stroke:var(--line);transition:stroke .3s,stroke-width .3s}
.fnode.acc rect{fill:var(--accent-soft);stroke:var(--accent)}
.fnode.ok rect{fill:var(--ok-soft);stroke:var(--ok)}
.fnode.warn rect{fill:var(--warn-soft);stroke:var(--warn)}
.fnode.cur rect{stroke-width:2.5}
.ft{font:600 12px var(--font-display);fill:var(--fg)}
.fs{font:400 10px var(--font-mono);fill:var(--muted)}
.fe path{fill:none;stroke:var(--muted);stroke-width:1.6}
.fe polygon{fill:var(--muted)}
.fe.warn path{stroke:var(--warn)}
.fe.warn polygon{fill:var(--warn)}
.zc{transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.zc.bad rect{stroke:var(--warn);fill:var(--warn-soft)}
.ew{cursor:pointer}
.ew circle:first-child{fill:var(--muted);transition:fill .3s}
.ew.me circle:first-child{fill:var(--accent)}
.ew.nb circle:first-child{fill:var(--ok)}
.ew.me text{fill:var(--fg);font-weight:700}
.ea{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:3 3}
.ea.me{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:none}
.we{transition:opacity .3s}
.we.pw line{stroke:var(--accent)}
.we.nw line{stroke:var(--warn)}
.we.zw0 line{stroke:var(--muted);stroke-dasharray:3 3;opacity:.5}
.we.dim{opacity:.18}
.wl{font:500 9px var(--font-mono);fill:var(--muted)}
.nn{fill:var(--surface);stroke:var(--fg);stroke-width:1.5}
.nt0{font:600 12px var(--font-mono);fill:var(--fg)}
.nh.dead .nn{fill:var(--surface2);stroke:var(--muted);stroke-dasharray:3 3}
.sec{stroke:var(--accent);stroke-width:2}
.pa{fill:var(--fg);stroke:var(--surface);stroke-width:2}
.pb{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.shade{fill:var(--accent-soft);opacity:.85;stroke:none}
.sbar{fill:var(--accent);transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.gv{font:600 12px var(--font-mono);fill:var(--fg)}
.dp2{fill:var(--accent);opacity:.85}
.rs{stroke:var(--warn);stroke-width:1;opacity:.6}
.rg{stroke:none}
.rg.r0{fill:var(--accent-soft)}
.rg.r1{fill:var(--warn-soft)}
.sp{stroke:var(--fg);stroke-width:1.4}
.fresh{animation:zfade .6s ease both}
@keyframes zfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fresh{animation:none}}
.tr0 polygon{fill:var(--ok-soft);stroke:var(--ok)}
.tr0 rect{fill:var(--ok)}
.kp.wr{stroke:var(--fg);stroke-width:2.5}
.gv2{font:600 13px var(--font-display);fill:var(--fg)}
.gv2.good{fill:var(--ok)}
.gv2.bad2{fill:var(--warn)}

"1.2":{title:"Broadcasting and axes",min:25,viz:"bcast",

col = np.array([10., 20.])            # (2,) would fail, so make it (2, 1)
print((x + col[:, None]).tolist())    # [[11.0, 12.0, 13.0], [24.0, 25.0, 26.0]]

print(x.sum(axis=0))                  # [5. 7. 9.]   shape (3,)
print(x.sum(axis=1))                  # [ 6. 15.]    shape (2,)

row_means = x.mean(axis=1, keepdims=True)   # shape (2, 1)
print(row_means.tolist())             # [[2.0], [5.0]]
print((x - row_means).tolist())       # [[-1.0, 0.0, 1.0], [-1.0, 0.0, 1.0]]`,

"1.6":{title:"Cleaning messy data",min:25,viz:"pdclean",
 why:"Real data has gaps, duplicates and typos. How you clean it changes your results, so cleaning is a decision you must be able to explain.",

  "Start by measuring the mess. isna().sum() counts missing values per column, duplicated().sum() counts repeated rows, and value_counts() reveals typos such as 'Pune', 'pune' and 'Pune '.",
  "For missing values you have three honest options. Drop the rows, fill with a sensible value such as the median, or keep the gap and add a flag column that records it. Dropping is fine when few rows are affected. The median is robust to outliers. Write down which option you chose and why.",
  "Fix text with the str methods: str.strip removes stray spaces and str.lower makes case consistent. Remove repeated rows with drop_duplicates, and convert types with pd.to_numeric.",

 code:`import numpy as np
import pandas as pd

raw = pd.DataFrame({
    "city":   ["Pune", "pune ", "Chennai", "Chennai", None],
    "salary": ["24", "24", "26", "26", "30"],
    "exp":    [3, 3, np.nan, np.nan, 7],
})

"2.1":{title:"Vectors and embeddings",min:20,viz:"embed",
 why:"Embeddings, the heart of modern AI, are just vectors. This lesson gives you the picture to hold on to.",
 explain:[
  "A vector is an ordered list of numbers. You can picture it as an arrow from the origin or as a point in space. In NumPy it is an array of shape (n,), and n is its dimension.",
  "Vectors add and scale entry by entry. a + b places the arrow b at the tip of a, and 2 * a doubles the length without changing direction. The length, or norm, is the square root of the sum of squares, and np.linalg.norm computes it.",
  "An embedding is a vector that stands for something, such as a word, a sentence or an image. A model is trained so that similar things get nearby vectors. Real embeddings have hundreds or thousands of dimensions, but the ideas you learn in two or three dimensions still apply.",
  "A unit vector has length 1. Dividing a vector by its norm gives a unit vector that keeps the direction. Unit vectors make comparison by angle simple, which is the next lesson."],
 key:["A vector is a list of numbers, an arrow, or a point.","Vectors add and scale entry by entry.","The norm is the length: square root of the sum of squares.","An embedding is a vector that stands for something.","Divide by the norm to get a unit vector."],
 code:`import numpy as np

a = np.array([3., 4.])
b = np.array([1., 2.])
print(a + b)                        # [4. 6.]
print(2 * a)                        # [6. 8.]
print(a - b)                        # [2. 2.]   the arrow from b to a
print(np.linalg.norm(a))            # 5.0       a 3-4-5 triangle

unit = a / np.linalg.norm(a)
print(unit)                         # [0.6 0.8]
print(np.linalg.norm(unit))         # 1.0

# a toy embedding table: 3 words, 4 numbers each
words = ["cat", "dog", "car"]
E = np.array([[0.9, 0.1, 0.8, 0.0],
              [0.8, 0.2, 0.9, 0.1],
              [0.1, 0.9, 0.0, 0.8]])
print(E.shape)                      # (3, 4)
print(E[words.index("dog")])        # [0.8 0.2 0.9 0.1]`,
 out:"The embedding table is made up. Real tables hold tens of thousands of rows and hundreds of columns.",
 watch:[R.la],
 check:[
  {q:"What is the length of the vector [6, 8]?",a:"10. It is the square root of 36 plus 64."},
  {q:"How do you turn any non-zero vector into a unit vector?",a:"Divide it by its norm. It keeps its direction and gets length 1."},
  {q:"An embedding table has shape (30000, 512). What do the numbers mean?",a:"There are 30,000 items, such as words or tokens, and each is described by a vector of 512 numbers."}],
 ex:"Create three 2-number vectors by hand. Add two of them, scale one by 3, and compute all three norms. Draw the arrows on paper and check they match your numbers.",

"2.2":{title:"Dot product and cosine similarity",min:25,viz:"cosine",
 why:"The dot product is how a model asks how well two vectors agree. Attention is built from it, so this is the most reused operation in the course.",
 explain:[
  "The dot product multiplies matching entries and adds them up. Geometrically, a · b = |a| |b| cos(angle). It is large and positive when two vectors point the same way, zero when they are perpendicular, and negative when they point in opposite directions.",
  "The dot product also grows with vector length. Cosine similarity divides by both lengths, so it measures only the angle between the vectors. It ranges from -1 to 1 and is the usual way to ask how similar two embeddings are.",
  "To find the closest item to a query, compute the cosine between the query and every item and take the largest. This nearest-neighbour search is the core of semantic search and of RAG, which you will build in Layer 5.",
  "Later you will meet attention, where every score is a dot product between a query vector and a key vector. If dot products make sense now, attention will too."],
 key:["Dot product: multiply matching entries, then add.","Big and positive means same direction. Zero means perpendicular. Negative means opposite.","Cosine similarity removes length, so it compares direction only.","Nearest-neighbour search: take the item with the highest cosine to the query."],
 code:`import numpy as np

a = np.array([1., 2., 3.])
b = np.array([4., 5., 6.])
print(a @ b)                            # 32.0   = 1*4 + 2*5 + 3*6

def cosine(u, v):
    return u @ v / (np.linalg.norm(u) * np.linalg.norm(v))

king  = np.array([0.9, 0.8, 0.1])
queen = np.array([0.85, 0.82, 0.15])
apple = np.array([0.1, 0.2, 0.95])
print(round(cosine(king, queen), 3))    # 0.998
print(round(cosine(king, apple), 3))    # 0.293
print(round(cosine(a, 10 * a), 6))      # 1.0   length does not matter

words = ["king", "queen", "apple"]
V = np.stack([king, queen, apple])
scores = [cosine(king, v) for v in V]
print(words[int(np.argsort(scores)[-2])])   # queen   (best match after king itself)`,
 out:"The three-number vectors are made up. Real embeddings have hundreds or thousands of numbers.",
 watch:[R.la],
 check:[
  {q:"Two vectors have a dot product of 0. What does that tell you?",a:"They are perpendicular (orthogonal). Neither has any component along the other."},
  {q:"Why compare embeddings with cosine similarity instead of the raw dot product?",a:"The dot product grows with vector length. Cosine divides the lengths out, so it compares direction, which is what carries meaning."},
  {q:"How would you find the word closest to a query vector?",a:"Compute the cosine similarity between the query and every word vector, then take the word with the highest score."}],
 ex:"Write four word vectors of three numbers by hand. Normalise each row to length 1, then build the full 4 by 4 cosine similarity matrix with one matrix multiply, E @ E.T. Check that the diagonal is all 1s.",
 teach:"Start with arrows on a 2D plot so learners feel the dot product before they see the formula."},

"2.3":{title:"Matrices and neural-network layers",min:25,viz:"nnlayer",
 why:"A neural network layer is a matrix multiply plus a bias. Understand this lesson and you understand what a layer does to its input.",
 explain:[
  "A matrix is a grid of numbers with shape (rows, columns). Multiplying a matrix W by a vector x takes the dot product of each row of W with x. A (2, 3) matrix maps 3 numbers to 2 numbers.",
  "A neural network layer computes y = W x + b and then applies a nonlinear function such as ReLU, which sets negative numbers to zero. Without the nonlinearity, stacked layers would collapse into a single matrix, so the nonlinearity is what gives depth its power.",
  "The weights W and the bias b are the numbers that training adjusts. A layer from 784 inputs to 128 outputs has 784 × 128 weights plus 128 biases, which is 100,480 parameters.",
  "Two layers in a row is the same idea twice: the output of the first layer is the input of the second."],
 key:["A matrix maps a vector of one size to a vector of another size.","A layer is W x + b followed by a nonlinear function.","Without the nonlinearity, many layers equal one matrix.","Parameters: inputs × outputs weights, plus one bias per output."],
 code:`import numpy as np

W = np.array([[1., 0., 2.],
              [0., 1., -1.]])        # (2, 3)
x = np.array([3., 4., 5.])           # (3,)
b = np.array([0.5, -0.5])            # (2,)
y = W @ x + b
print(y)                             # [13.5 -1.5]

def relu(v):
    return np.maximum(v, 0)
print(relu(y))                       # [13.5  0. ]

# two layers: 3 -> 2 -> 1
W2 = np.array([[2., 1.]])            # (1, 2)
b2 = np.array([0.])
print(W2 @ relu(y) + b2)             # [27.]

print(784 * 128 + 128)               # 100480   parameters in one layer`,
 out:"The weights here are chosen by hand. In a real network, training finds them.",
 watch:[R.la,R.nn],
 check:[
  {q:"Why do networks need a nonlinear function between layers?",a:"Two matrix multiplies in a row equal one matrix multiply, so without a nonlinearity extra layers add nothing. The nonlinearity lets the network model curves."},
  {q:"How many parameters does a layer from 10 inputs to 4 outputs have?",a:"10 × 4 weights plus 4 biases, which is 44."},
  {q:"What does ReLU do to the vector [-2, 0.5, 3]?",a:"It sets negatives to zero and keeps the rest: [0, 0.5, 3]."}],

"2.4":{title:"Matrix multiplication and batching",min:25,viz:"matmul",
 why:"Matrix multiplication is the workhorse of deep learning, and shape errors in it are the most common bug. Batching turns many inputs into one multiply.",
 explain:[
  "The shape rule is (m, n) @ (n, p) gives (m, p). The two inner sizes must match and then disappear. Each output entry is the dot product of a row from the left matrix and a column from the right matrix.",
  "A batch of inputs is stacked into a matrix X with one row per example. X @ W.T applies a layer to every example at once. This is far faster than a Python loop, and it is how GPUs get their speed.",
  "Order matters: A @ B is usually not B @ A, and the shapes often do not even allow the swap. The transpose .T flips rows and columns, so (m, n) becomes (n, m).",
  "Elementwise * is different from matrix @. The * operator multiplies matching entries and needs matching or broadcastable shapes. The @ operator does the row-by-column dot products. Mixing them up is a classic bug."],
 key:["(m, n) @ (n, p) gives (m, p). The inner sizes must match.","Stack examples as rows, then X @ W.T applies a layer to the whole batch.","A @ B is not B @ A.","* is elementwise. @ is matrix multiplication."],
 code:`import numpy as np

rng = np.random.default_rng(0)
X = rng.random((5, 3))        # 5 examples, 3 features each
W = rng.random((2, 3))        # a layer: 3 inputs -> 2 outputs
b = rng.random(2)

Y = X @ W.T + b               # (5, 3) @ (3, 2) -> (5, 2), plus (2,) broadcast
print(Y.shape)                # (5, 2)

y0 = W @ X[0] + b             # the same layer, one example at a time
print(np.allclose(Y[0], y0))  # True

A = np.array([[1., 2.], [3., 4.]])
B = np.array([[0., 1.], [1., 0.]])
print((A @ B).tolist())       # [[2.0, 1.0], [4.0, 3.0]]
print((B @ A).tolist())       # [[3.0, 4.0], [1.0, 2.0]]
print((A * B).tolist())       # [[0.0, 2.0], [3.0, 0.0]]`,
 out:"A @ B and B @ A differ, and A * B is a third thing again.",
 watch:[R.la,R.np],
 check:[
  {q:"What shape does (64, 784) @ (784, 10) produce?",a:"(64, 10): 64 examples, each with 10 outputs."},
  {q:"Does A @ B equal B @ A?",a:"Usually not. Matrix multiplication is not commutative, and the shapes may not even allow the swap."},
  {q:"A batch X has shape (32, 5) and W has shape (3, 5). How do you apply the layer to the whole batch?",a:"X @ W.T gives (32, 3). Transposing W makes the inner sizes match."}],

"3.1":{title:"Derivatives as slopes",min:20,viz:"deriv",
 why:"A derivative is how a model knows which way to change a weight. It is the one calculus idea you must truly own.",
 explain:[
  "A derivative measures how fast a function's output changes when its input changes by a tiny amount. Geometrically it is the slope of the curve at one point. A positive slope means the output rises with the input, a negative slope means it falls, and a zero slope means the curve is flat, which is where minima live.",
  "You can estimate a derivative numerically: (f(x + h) - f(x - h)) / (2h) for a tiny h. This is how you check any formula you derive, and it is called a numerical gradient check.",
  "A few rules cover most of what you need. The derivative of x squared is 2x. The derivative of a constant is 0. A constant times a function keeps the constant. A sum is differentiated part by part.",
  "In training, the function is the loss and the input is a weight. The derivative says how the loss changes if you nudge that weight, which is exactly the information needed to improve the weight."],
 key:["A derivative is the slope of a curve at a point.","Positive: rising. Negative: falling. Zero: flat.","Check a formula with the numerical slope (f(x+h) - f(x-h)) / 2h.","d/dx of x² is 2x. Constants vanish. Sums split."],
 code:`def f(x):
    return x ** 2

def slope(f, x, h=1e-5):
    return (f(x + h) - f(x - h)) / (2 * h)      # central difference

print(round(slope(f, 3.0), 4))      # 6.0     since d/dx x^2 = 2x
print(round(slope(f, 0.0), 4))      # 0.0     flat at the bottom
print(round(slope(f, -2.0), 4))     # -4.0    negative on the left

def g(x):
    return 3 * x ** 2 + 2 * x + 5
print(round(slope(g, 1.0), 4))      # 8.0     since g'(x) = 6x + 2`,
 out:"The numerical slope matches the formula every time, which is the point of a gradient check.",
 watch:[R.nn],
 check:[
  {q:"What is the derivative of 5x² + 3x?",a:"10x + 3."},
  {q:"The slope of the loss at a weight is negative. Should the weight go up or down to lower the loss?",a:"Up. A negative slope means the loss falls as the weight rises."},
  {q:"Why does a slope of zero matter in training?",a:"A flat spot is where a minimum, or a maximum, can sit. Training aims for places where the slope is near zero."}],
 ex:"Use the slope function to check three derivatives you work out by hand: x³ at x = 2, 1/x at x = 2, and 4x² − x at x = 1.",
 teach:"Let learners zoom into a curve until it looks like a straight line. That straight line is what slope means."},

"3.2":{title:"Gradients and the loss surface",min:25,viz:"gradsurf",
 why:"A model has millions of weights, so you need the slope for each one at once. That list of slopes is the gradient.",
 explain:[
  "With two or more inputs, a function has a slope along each input, called a partial derivative. Treat the other inputs as constants and differentiate with respect to one input.",
  "The gradient is the vector of all the partial derivatives. It points in the direction of steepest increase, and its length says how steep that is. Minus the gradient is therefore the direction of steepest decrease.",
  "Picture the loss as a landscape over the weights: each point is one choice of weights and its height is the loss. Training is walking downhill. A bowl has one bottom. Real networks have valleys, ridges and plateaus, but walking downhill still works well in practice.",
  "For L(w1, w2) = (w1 − 3)² + 4(w2 + 1)², the partial derivatives are 2(w1 − 3) and 8(w2 + 1). The minimum is at (3, −1), where both are zero."],
 key:["A partial derivative is the slope along one input, with the others held fixed.","The gradient collects all partial derivatives into one vector.","The gradient points uphill. Minus the gradient points downhill.","Training is walking downhill on the loss landscape."],
 code:`import numpy as np

def L(w):
    return (w[0] - 3) ** 2 + 4 * (w[1] + 1) ** 2

def grad(w):
    return np.array([2 * (w[0] - 3), 8 * (w[1] + 1)])

def numeric_grad(w, h=1e-5):
    g = np.zeros_like(w)
    for i in range(len(w)):
        d = np.zeros_like(w)
        d[i] = h
        g[i] = (L(w + d) - L(w - d)) / (2 * h)
    return g

w = np.array([0.0, 0.0])
print(L(w))                              # 13.0
print(grad(w))                           # [-6.  8.]
print(np.round(numeric_grad(w), 3))      # [-6.  8.]   matches

step = w - 0.1 * grad(w)                 # one downhill step
print(step, round(L(step), 2))           # [ 0.6 -0.8] 5.92`,
 out:"One small step downhill took the loss from 13 to 5.92.",
 watch:[R.nn],
 check:[
  {q:"For L = w1² + 3·w2, what is the gradient?",a:"[2·w1, 3]. Differentiate with respect to each variable separately."},
  {q:"Which way does the gradient point, and which way do we step to reduce the loss?",a:"The gradient points uphill. We step along minus the gradient to go downhill."},
  {q:"Why compare an analytic gradient with a numerical one?",a:"It catches mistakes in the formula. If the two disagree by more than rounding error, the formula is wrong."}],
 ex:"Run 50 steps of gradient descent on the two-variable loss above with lr = 0.1, starting at (0, 0). Print the weights every 10 steps and confirm they approach (3, −1).",
 teach:"Use a contour map like a hiking map and mark arrows on it. Learners see that the gradient is perpendicular to the contour lines."},

"3.3":{title:"Gradient descent by hand",min:30,viz:"descent",
 why:"Training any neural network is gradient descent. If you can do one step by hand, you understand what the framework does for you.",
 explain:[
  "Gradient descent repeats one step: w = w - lr * gradient. The learning rate lr sets the step size. Each step moves every weight a little against its slope, so the loss falls.",
  "If lr is too small, training crawls. If it is too large, the steps overshoot the minimum and the loss can grow instead of shrink. Picking the learning rate is one of the most important choices in training.",
  "The example below fits y = w * x to one data point with a squared-error loss. It is small enough to check by hand, and every neural network training loop is a bigger version of it.",
  "Watch the numbers, not just the final answer. With lr = 0.05 the error shrinks by a factor of 0.6 each step, so the loss shrinks by 0.36. With lr = 0.3 the error is multiplied by -1.4 each step, so it flips sign and grows."],
 key:["Update rule: w = w - lr * gradient.","Too small a learning rate crawls. Too large diverges.","Loss values before and after each step tell you whether training works.","Every training loop is this loop, with more weights."],
 code:`x, target = 2.0, 6.0
w, lr = 0.0, 0.05

for step in range(8):
    pred = w * x
    loss = (pred - target) ** 2
    grad = 2 * (pred - target) * x      # dL/dw by the chain rule
    w = w - lr * grad
    print(f"step {step}: w={w:.4f} loss={loss:.4f}")

# step 0: w=1.2000 loss=36.0000
# step 1: w=1.9200 loss=12.9600
# step 2: w=2.3520 loss=4.6656
# ... w moves toward 3, because 3 * 2 = 6`,
 out:"The loss shown is the value before each update. Change lr to 0.3 and watch the run fail.",
 watch:[R.nn,R.micro],
 check:[
  {q:"The loss is L = (w*x - t)^2. What is dL/dw?",a:"2 * (w*x - t) * x. The outer square gives 2 * (w*x - t), and the inner w*x gives x, multiplied together by the chain rule."},
  {q:"The gradient is negative at the current w. Which way does w move?",a:"Up. The update subtracts lr times a negative number, which increases w."},
  {q:"In the example, what happens with lr = 0.3?",a:"The update becomes w = -1.4 * w + 7.2, so the distance from 3 is multiplied by -1.4 each step. It flips sign and grows, so training diverges."}],
 ex:"Change the loop to fit y = w*x + b on the points (1, 3), (2, 5) and (3, 7), using the mean of the gradients over the three points. Run 500 steps with lr = 0.05. The values should end close to w = 2 and b = 1.",
 teach:"Let learners change the learning rate and watch the loss blow up. Seeing divergence sticks better than any explanation of it."},

"3.4":{title:"The chain rule and backpropagation",min:30,viz:"backprop",
 why:"Backpropagation is how every neural network learns. It is the chain rule, applied carefully and in the right order.",
 explain:[
  "The chain rule says: if y depends on u and u depends on w, then dy/dw = dy/du × du/dw. Slopes along a chain multiply. If a change in w makes u change 3 times as fast, and a change in u makes y change 2 times as fast, then y changes 6 times as fast.",
  "A network is a chain: input, layer 1, layer 2, loss. The forward pass computes each value in order and remembers it. The backward pass starts at the loss and moves backward, multiplying local slopes, so every weight ends up with its gradient.",
  "Each operation only needs to know its own local slope. For a × b the slope with respect to a is b, and with respect to b it is a. Addition passes the slope through unchanged. ReLU passes it through for positive inputs and blocks it for negative ones. Backprop combines these small facts.",
  "Reusing the stored forward values makes backprop cheap. The backward pass costs about as much as the forward pass, which is why training models with millions of weights is feasible."],
 key:["Chain rule: slopes along a chain multiply.","Forward pass computes and stores values. Backward pass multiplies local slopes from the loss back.","Each operation needs only its own local slope.","ReLU blocks the gradient for negative inputs."],
 code:`# a tiny network: y = w2 * relu(w1 * x), loss = (y - t)^2
x, t = 2.0, 10.0
w1, w2 = 1.5, 2.0

# forward pass: compute and remember each value
u = w1 * x             # 3.0
h = max(u, 0.0)        # 3.0   relu
y = w2 * h             # 6.0
loss = (y - t) ** 2    # 16.0

# backward pass: multiply local slopes from the loss back
dloss_dy = 2 * (y - t)                       # -8.0
dy_dw2 = h                                   # 3.0
dy_dh = w2                                   # 2.0
dh_du = 1.0 if u > 0 else 0.0                # 1.0   relu slope
du_dw1 = x                                   # 2.0

g_w2 = dloss_dy * dy_dw2                     # -24.0
g_w1 = dloss_dy * dy_dh * dh_du * du_dw1     # -32.0
print(loss, g_w2, g_w1)                      # 16.0 -24.0 -32.0

# check against a numerical slope for w1
def run(w1, w2):
    return (w2 * max(w1 * x, 0.0) - t) ** 2
eps = 1e-6
print(round((run(w1 + eps, w2) - run(w1 - eps, w2)) / (2 * eps), 3))   # -32.0`,
 out:"The hand-computed gradient and the numerical check agree, which means the backward pass is right.",
 watch:[R.micro,R.nn],
 check:[
  {q:"If y = 3u and u = 5w, what is dy/dw?",a:"15. The slopes along the chain multiply: 3 × 5."},
  {q:"Why does the forward pass store its intermediate values?",a:"The backward pass needs them to compute local slopes, such as dy/dw2 = h. Storing them avoids recomputing."},
  {q:"What is the slope of ReLU for a negative input, and what does that do to the gradient flowing back?",a:"It is 0, so the gradient through that unit is cut off and the weights before it get no update from this example."}],
 ex:"Change t to 4 and work out the forward and backward pass by hand, then run the code to confirm. Then try w1 = -1 and explain why g_w1 becomes 0.",
 teach:"Draw the computation as boxes and arrows and write each local slope on its arrow. The backward pass is just multiplying along the path."},

"4.1":{title:"Probability and distributions",min:20,viz:"probdist",
 why:"A language model's output is a probability distribution. Everything in this course that says 'likely' needs this vocabulary.",
 explain:[
  "Probability gives each outcome a number between 0 and 1, and the numbers for all outcomes add up to 1. An event is a set of outcomes, and its probability is the sum over those outcomes.",
  "A random variable is a quantity that takes different values by chance, such as a die roll. Its distribution lists how likely each value is. For a fair die, each face has probability 1/6.",
  "Two events are independent if one tells you nothing about the other. For independent events, P(A and B) = P(A) × P(B). Rolling two sixes in a row has probability 1/36.",
  "You can estimate a probability by simulating many trials and counting. The proportion settles toward the true probability as the trials grow. This is the law of large numbers."],
 key:["Probabilities lie between 0 and 1, and all outcomes sum to 1.","A distribution lists the probability of each value.","Independent events multiply: P(A and B) = P(A) × P(B).","Simulation estimates probabilities. More trials, better estimate."],
 code:`import numpy as np

rng = np.random.default_rng(0)
rolls = rng.integers(1, 7, size=100_000)       # a fair die, faces 1..6

print(round((rolls == 6).mean(), 2))           # 0.17   close to 1/6
print(round((rolls % 2 == 0).mean(), 2))       # 0.5    even faces

two = rng.integers(1, 7, size=(100_000, 2))
both_six = ((two[:, 0] == 6) & (two[:, 1] == 6)).mean()
print(round(both_six, 2), round(1 / 36, 2))    # 0.03 0.03

vals, counts = np.unique(rolls, return_counts=True)
print(dict(zip(vals.tolist(), (counts / counts.sum()).round(2).tolist())))
# {1: 0.17, 2: 0.17, 3: 0.17, 4: 0.17, 5: 0.17, 6: 0.17}`,
 out:"The estimates come from simulation, so they differ slightly from the exact values.",
 watch:[R.sq],
 check:[
  {q:"The probabilities of all the outcomes of an experiment sum to what?",a:"1."},
  {q:"A coin lands heads 50% of the time. What is the chance of three heads in a row, and what do you assume?",a:"0.5 × 0.5 × 0.5 = 0.125, assuming the flips are independent."},
  {q:"Why does simulating more trials give a better estimate?",a:"Random fluctuations average out as the trials grow, so the observed proportion approaches the true probability."}],
 ex:"Simulate rolling two dice 100,000 times and estimate the probability that the sum is 7. Compare it with the exact answer 6/36.",
 teach:"Run a simulation live with 10, 100 and 100,000 trials. Watching the estimate settle is more convincing than the law itself."},

"4.2":{title:"Expectation, variance and the normal curve",min:25,viz:"normal",
 why:"Averages and spread describe every dataset and every model output. The normal curve also decides how network weights are first set.",
 explain:[
  "The expected value is the long-run average: each value times its probability, summed. For a fair die it is (1+2+3+4+5+6)/6 = 3.5. The expected value need not be a value that can occur.",
  "Variance measures spread: the average squared distance from the mean. The standard deviation is its square root, in the original units. For a fair die the variance is 35/12, about 2.92.",
  "The normal distribution, or bell curve, is described by its mean and standard deviation. About 68% of values fall within one standard deviation of the mean and about 95% within two.",
  "Sums of many small independent effects tend to look normal, which is why it appears everywhere. Network weights are often initialised from a normal distribution with a small standard deviation, so every layer starts with outputs of a sensible size."],
 key:["Expected value: sum of value × probability.","Variance is the average squared distance from the mean. The standard deviation is its square root.","Normal: about 68% within 1 standard deviation, about 95% within 2.","Weights often start as small random normal numbers."],
 code:`import numpy as np

faces = np.arange(1, 7)
p = np.full(6, 1 / 6)
mean = (faces * p).sum()
var = (((faces - mean) ** 2) * p).sum()
print(mean, round(var, 3))                           # 3.5 2.917

rng = np.random.default_rng(0)
x = rng.normal(loc=50, scale=10, size=100_000)       # mean 50, std 10
print(round(x.mean()), round(x.std()))               # 50 10
print(round(((x > 40) & (x < 60)).mean(), 2))        # 0.68   within 1 std
print(round(((x > 30) & (x < 70)).mean(), 2))        # 0.95   within 2 std

W = rng.normal(0, 0.02, size=(256, 128))             # a small random weight matrix
print(W.shape, round(W.std(), 2))                    # (256, 128) 0.02`,
 out:"The 68% and 95% figures come from simulation and match the rule of thumb.",
 watch:[R.sq],
 check:[
  {q:"What is the expected value of a fair six-sided die, and must it be a possible roll?",a:"3.5. No. An expected value is an average and need not be a possible outcome."},
  {q:"Test scores have mean 60 and standard deviation 8. Roughly what range holds 95% of scores?",a:"About 44 to 76, which is two standard deviations either side of the mean."},
  {q:"Why is variance computed with squared distances?",a:"Squaring stops positive and negative deviations cancelling and punishes large deviations more. Taking the square root returns the original units."}],
 ex:"Draw 10,000 samples from a normal distribution with mean 0 and standard deviation 1. Check the 68% and 95% rules, then repeat with standard deviation 3 and note what changes.",
 teach:"Overlay histograms of normal data with different standard deviations. Learners see mean as position and standard deviation as width."},

"4.3":{title:"Conditional probability and Bayes",min:30,viz:"bayes",
 why:"Evaluating models and reading test results both need Bayes-style thinking. It is also the clearest example of why base rates matter.",
 explain:[
  "Conditional probability, written P(A|B), is the probability of A given that B happened. Bayes' rule flips it: P(A|B) = P(B|A) * P(A) / P(B). It tells you how to update a belief after seeing evidence.",
  "The classic trap is ignoring the base rate. If a disease is rare, most positive tests come from the large healthy group, even when the test is good. The example below shows a test with 99% sensitivity giving only about a 17% chance of disease after a positive result.",
  "Natural frequencies make this easier to see. Imagine 10,000 people instead of percentages. With 1% prevalence, 100 are sick and 99 of them test positive. Of the 9,900 healthy people, 5% or 495 also test positive. Only 99 of 594 positives are really sick.",
  "This matters beyond medicine. A spam filter, a fraud detector and a safety classifier all face rare events, and precision on rare events depends heavily on how rare they are."],
 key:["P(A|B) is not the same as P(B|A).","Bayes' rule: P(A|B) = P(B|A) * P(A) / P(B).","Always include the base rate. Rare things stay unlikely after a good test.","Natural frequencies, such as 'out of 10,000 people', make Bayes easy."],
 code:`# Bayes: P(disease | positive test)
prior = 0.01          # 1% of people have the disease
sens  = 0.99          # P(positive | disease)
fpr   = 0.05          # P(positive | no disease)

p_pos = sens * prior + fpr * (1 - prior)
posterior = sens * prior / p_pos
print(round(posterior, 3))                 # 0.167

# the same thing as natural frequencies, out of 10,000 people
people = 10_000
sick = people * prior                      # 100
true_pos = sick * sens                     # 99
false_pos = (people - sick) * fpr          # 495
print(round(true_pos), round(false_pos), round(true_pos / (true_pos + false_pos), 3))
# 99 495 0.167`,
 out:"Both routes give the same answer. Try prior = 0.10 and prior = 0.001 and predict the result first.",
 watch:[R.bayes,R.sq],
 check:[
  {q:"A test has 99% sensitivity and a 5% false-positive rate, and 1% of people are sick. Why is a positive result only about 17% likely to be real?",a:"Out of 10,000 people, 99 sick people test positive, but so do about 495 of the 9,900 healthy people. Only 99 of about 594 positives are real."},
  {q:"What is the difference between P(positive | sick) and P(sick | positive)?",a:"The first is the test's sensitivity. The second is what you want to know after a positive test. They can be very different, and Bayes' rule connects them."},
  {q:"Why does a rarer disease lower P(sick | positive) for the same test?",a:"There are fewer sick people to produce true positives, but just as many healthy people to produce false ones, so false positives take a larger share."}],
 ex:"Change the prior in the code to 10% and then to 0.1%. Predict each result first, then run it. In two sentences, explain how the answer depends on the base rate.",
 teach:"Use natural frequencies such as 'out of 10,000 people' instead of percentages. Learners follow Bayes much more easily that way."},

"4.4":{title:"Softmax and sampling",min:25,viz:"softmax",
 why:"Softmax and sampling are the last two steps every language model takes. After this lesson you can explain how a model chooses its next word.",
 explain:[
  "A model's final layer outputs raw scores called logits, one per possible next token. They can be any real numbers. Softmax turns them into probabilities: exponentiate each score, then divide by the total. Larger scores get larger probabilities, and everything sums to 1.",
  "Temperature divides the logits before softmax. A temperature below 1 sharpens the distribution toward the top choice. A temperature above 1 flattens it, giving unlikely tokens a better chance. A temperature near 0 approaches always picking the best token.",
  "To produce text, the model samples a token from the distribution, appends it and repeats. Top-k keeps only the k most likely tokens, and top-p keeps the smallest set of tokens whose probabilities add up to p. Both cut off the unlikely tail.",
  "Softmax can overflow for large scores, so implementations subtract the largest score first. The result is identical because the constant cancels."],
 key:["Logits are raw scores. Softmax turns them into probabilities.","Temperature below 1 sharpens. Above 1 flattens.","Sampling picks the next token from the distribution.","Top-k and top-p cut off the unlikely tail."],
 code:`import numpy as np

def softmax(z, T=1.0):
    z = np.asarray(z, dtype=float) / T
    z = z - z.max()                  # numerical safety; the result is unchanged
    e = np.exp(z)
    return e / e.sum()

logits = [2.0, 1.0, 0.1]
print(softmax(logits).round(3))          # [0.659 0.242 0.099]
print(softmax(logits, T=0.5).round(3))   # [0.864 0.117 0.019]   sharper
print(softmax(logits, T=2.0).round(3))   # [0.502 0.304 0.194]   flatter

rng = np.random.default_rng(0)
tokens = ["cat", "dog", "fish"]
p = softmax(logits)
picks = rng.choice(tokens, size=10_000, p=p)
print({t: round(float((picks == t).mean()), 2) for t in tokens})   # close to the probabilities

def top_k(p, k):
    q = p.copy()
    q[np.argsort(q)[:-k]] = 0        # zero everything except the k largest
    return q / q.sum()
print(top_k(p, 2).round(3))              # [0.731 0.269 0.   ]`,
 out:"The sampled shares are close to the probabilities but not identical, because sampling is random.",
 watch:[R.sq],
 check:[
  {q:"The logits are [1, 1, 1]. What does softmax return?",a:"Equal probabilities, 1/3 each. Softmax depends only on the differences between scores."},
  {q:"Does a higher temperature make output more or less random?",a:"More random. It flattens the distribution, so unlikely tokens get more probability."},
  {q:"What does top-p = 0.9 do?",a:"It keeps the smallest group of most likely tokens whose probabilities add up to at least 0.9 and samples only from those."}],
 ex:"Print the probabilities of three logits for temperatures 0.1, 0.5, 1, 2 and 5. Describe in two sentences what happens at each end.",
 teach:"Let learners move a temperature slider and watch the bars change. Then ask which setting they would pick for code and which for poetry."}
};

"L2.4":{title:"Data leakage",min:25,viz:"leak",
 why:"Leakage is the biggest reason a model looks brilliant in a notebook and fails in production. It is also the easiest way to catch a learner out, so it deserves its own lesson.",
 explain:[
  "Leakage means information from outside the training data slips into training. The model then scores well because it has effectively seen the answers, not because it learned something real.",
  "The first kind is preprocessing leakage. If you scale, impute or select features using the whole dataset and then split, the held-out rows have already influenced the training step. The second kind is target leakage: a feature that is only known after the outcome, such as a refund-issued column when predicting churn. The third is duplicates or time leakage, where the same customer appears in both train and test, or the model sees the future.",
  "The demo below uses pure noise: 1000 random columns and random labels. There is nothing to learn, so any honest score should be near 0.5. Selecting the 10 best-looking columns on all rows first makes the cross-validated score look good. Selecting inside each training fold gives the honest answer.",
  "The fix is structural. Put every step that learns from data inside a Pipeline, and let cross-validation fit the whole pipeline on each training fold only."],
 key:["Leakage is information from held-out data reaching the training step.","Fit scalers, imputers and feature selectors on training rows only.","Watch for columns that are only known after the outcome.","A Pipeline passed to cross_val_score prevents preprocessing leakage."],
 code:`import numpy as np
from sklearn.feature_selection import SelectKBest, f_classif
from sklearn.linear_model import LogisticRegression
from sklearn.model_selection import cross_val_score
from sklearn.pipeline import make_pipeline

rng = np.random.default_rng(0)
X = rng.normal(size=(60, 1000))      # pure noise
y = rng.integers(0, 2, size=60)      # random labels, nothing to learn

# WRONG: pick the best features using all rows, then cross-validate
X_sel = SelectKBest(f_classif, k=10).fit_transform(X, y)
wrong = cross_val_score(LogisticRegression(), X_sel, y, cv=5).mean()

# RIGHT: do the selection inside each training fold
pipe = make_pipeline(SelectKBest(f_classif, k=10), LogisticRegression())
right = cross_val_score(pipe, X, y, cv=5).mean()

print(round(wrong, 2), round(right, 2))   # 0.82 0.43`,

from sklearn.linear_model import LinearRegression

rng = np.random.default_rng(0)

model = LinearRegression().fit(x.reshape(-1, 1), y)

w, b = np.linalg.lstsq(A, y, rcond=None)[0]

from sklearn.datasets import load_iris
from sklearn.tree import DecisionTreeClassifier, export_text

def gini(counts):
    p = np.array(counts) / sum(counts)
    return 1 - (p ** 2).sum()

print(gini([50, 50]), gini([50, 0]), round(gini([49, 5]), 3))   # 0.5 0.0 0.168

iris = load_iris()
tree = DecisionTreeClassifier(max_depth=2, random_state=0).fit(iris.data, iris.target)
print(export_text(tree, feature_names=list(iris.feature_names)))

# |   |--- petal width (cm) <= 1.75

# |   |--- petal width (cm) >  1.75

"L2.10":{title:"Overfitting and bias-variance",min:30,viz:"overfit",
 why:"Overfitting is the central problem of machine learning, and it returns in every layer. A learner who can explain it with a picture can follow almost every later technique.",
 explain:[
  "A model underfits when it is too simple to capture the pattern: both training and test error are high. It overfits when it is flexible enough to chase the noise: training error is tiny but test error is large. The gap between them is the warning sign.",
  "Bias is the error from being too simple, such as drawing a straight line through a curve. Variance is the error from being too sensitive to the particular training sample, so a different sample would give a very different model. More flexibility lowers bias and raises variance.",
  "The demo below fits polynomials of increasing degree to 12 noisy points from a sine curve. Degree 1 is a line that misses the bend. Degree 3 follows the curve. Degree 9 passes close to every point and wiggles wildly in between, so its error on the true curve explodes.",
  "You manage the trade-off with more data, simpler models, regularisation (L2.11) and cross-validation (L2.12). Always compare training and held-out error, never training error alone."],
 key:["Underfitting: both errors high. Overfitting: training error low, test error high.","Bias is error from being too simple. Variance is error from being too sensitive to the sample.","More flexibility lowers bias and raises variance.","Compare training and held-out error. The gap is the signal."],
 code:`import numpy as np
from numpy.polynomial import Polynomial

rng = np.random.default_rng(1)
x_train = np.sort(rng.uniform(0, 1, 12))
y_train = np.sin(2 * np.pi * x_train) + rng.normal(0, 0.25, 12)
x_test = np.linspace(0, 1, 200)
y_test = np.sin(2 * np.pi * x_test)          # the noise-free truth

def mse(a, b):
    return float(np.mean((a - b) ** 2))

for degree in (1, 3, 9):
    p = Polynomial.fit(x_train, y_train, degree)
    print(degree, round(mse(p(x_train), y_train), 3), round(mse(p(x_test), y_test), 3))
# 1 0.237 0.243
# 3 0.01 0.02
# 9 0.001 0.765`,

"L2.12":{title:"Cross-validation",min:20,viz:"cvfolds",

"L2.13":{title:"Classification metrics",min:30,viz:"thresh",
 why:"Accuracy hides the failures that matter most. Precision, recall and the threshold are the vocabulary for talking about a classifier honestly, and they carry straight into evaluating language models.",
 explain:[
  "A confusion matrix counts four outcomes: true positives (TP), false positives (FP), false negatives (FN) and true negatives (TN). Every metric is built from these four numbers.",
  "Accuracy is (TP + TN) divided by everything. Precision is TP / (TP + FP): of the cases you flagged, how many were right. Recall is TP / (TP + FN): of the real cases, how many you found. F1 is the harmonic mean of the two.",
  "Accuracy misleads when one class is rare. A model that always says healthy scores 0.9 on data where 10% are ill, yet finds none of them. Which metric to watch depends on cost: missing a cancer is worse than a false alarm, so favour recall. Flagging a good email as spam is costly, so favour precision.",
  "The threshold links them. Lowering it flags more cases, which raises recall and lowers precision. The demo below lets you move the threshold and watch the trade-off."],
 key:["Every metric comes from TP, FP, FN and TN.","Precision asks how many flagged were right. Recall asks how many real cases were found.","Accuracy misleads on imbalanced data.","Moving the threshold trades precision against recall."],
 code:`import numpy as np

y_pred = np.array([1] * 8 + [0] * 2 + [1] * 4 + [0] * 86)

print(confusion_matrix(y_true, y_pred).tolist())    # [[86, 4], [2, 8]]
tn, fp, fn, tp = confusion_matrix(y_true, y_pred).ravel()

print(round(accuracy_score(y_true, y_pred), 3))     # 0.94

 code:`import numpy as np
from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score

y_true = np.array([3.0, 5.0, 2.0, 8.0])
y_pred = np.array([2.5, 5.0, 4.0, 7.0])
err = y_pred - y_true

mse = (err ** 2).mean()
print(mse, mean_squared_error(y_true, y_pred))                   # 1.3125 1.3125

"L2.15":{title:"scikit-learn pipelines",min:30,viz:"pipe",
 why:"Pipelines turn a notebook of loose steps into one object that can be cross-validated, saved and shipped without leakage. It is how real tabular projects are structured.",
 explain:[
  "A Pipeline chains steps so the output of one feeds the next, and the last step is the model. Calling fit on the pipeline fits every step on the data it receives, and predict runs the same steps on new rows.",
  "Real tables mix column types. ColumnTransformer applies different steps to different columns: impute then scale the numeric ones, one-hot encode the categorical ones. The pieces are joined back into one feature matrix.",
  "Because the whole pipeline is one estimator, cross_val_score refits all of it on each training fold. That removes preprocessing leakage by construction, which is the main reason to use it.",
  "A pipeline can be inspected: model[:-1].transform(X) shows the features the model finally sees. In the demo, two numeric columns plus three city columns give five features."],
 key:["A Pipeline chains preprocessing steps and a final model into one estimator.","ColumnTransformer applies different steps to different columns.","Cross-validating the pipeline refits every step per fold, which prevents leakage.","model[:-1].transform(X) shows what the model sees."],
 code:`import numpy as np
import pandas as pd
from sklearn.compose import ColumnTransformer
from sklearn.impute import SimpleImputer
from sklearn.linear_model import LogisticRegression
from sklearn.model_selection import cross_val_score
from sklearn.pipeline import Pipeline
from sklearn.preprocessing import OneHotEncoder, StandardScaler

rng = np.random.default_rng(0)
n = 400
df = pd.DataFrame({
    "age": rng.integers(20, 60, n).astype(float),
    "income": rng.normal(50, 15, n),
    "city": rng.choice(["Pune", "Delhi", "Chennai"], n),
})
df["bought"] = ((df["income"] + (df["city"] == "Delhi") * 15 + rng.normal(0, 8, n)) > 55).astype(int)
df.loc[rng.choice(n, 40, replace=False), "income"] = np.nan     # 40 missing incomes

X, y = df.drop(columns="bought"), df["bought"]

prep = ColumnTransformer([
    ("num", Pipeline([("fill", SimpleImputer(strategy="median")),
                      ("scale", StandardScaler())]), ["age", "income"]),
    ("cat", OneHotEncoder(), ["city"]),
])
model = Pipeline([("prep", prep), ("clf", LogisticRegression())])

print(round(cross_val_score(model, X, y, cv=5).mean(), 3))   # 0.847
model.fit(X, y)
print(model[:-1].transform(X).shape)                         # (400, 5)`,
 out:"One object handles missing values, scaling, encoding and the model, and cross-validation scores it at 0.847 without leaking. The model sees 5 features.",

  {q:"Why does cross-validating a Pipeline avoid leakage?",a:"Every step, including the imputer and scaler, is refitted on each training fold only, so the validation fold never influences preprocessing."}],

"L2.16":{title:"Hyperparameter search",min:25,viz:"gridflow",
 why:"Settings such as k in nearest neighbours or tree depth are not learned from data. Searching for them properly, without peeking at the test set, is a skill that separates careful work from lucky work.",

  "GridSearchCV tries every combination in a grid. For each combination it runs cross-validation, then picks the best and refits on all the training data. Six values of k times two weighting schemes times five folds is 60 fits, so grids get expensive fast. RandomizedSearchCV samples combinations instead and scales better.",
  "Search with the training set only. The test set must be untouched until the search is finished, then scored once. Searching a pipeline lets you tune preprocessing and the model together, using step__parameter names.",

from sklearn.model_selection import GridSearchCV, train_test_split

  "A neuron takes some numbers in, multiplies each by a weight, adds them up with a bias, and passes the total through an activation function. In symbols, z = w1*x1 + w2*x2 + ... + b, then output = f(z). The weights and the bias are the learnable parts.",

  "Without an activation between layers, a stack of linear layers collapses into one linear layer, so depth adds nothing. The activation bends the output, and that is what lets a network draw curved boundaries and learn complicated functions.",

print(r3(torch.tanh(z)))       # [-0.964, -0.462, 0.0, 0.462, 0.964]
print(r3(F.relu(z)))           # [0.0, 0.0, 0.0, 0.5, 2.0]

import torch.nn.functional as F

logits = torch.tensor([[2.0, 1.0, 0.1]])
target = torch.tensor([0])               # the right class is 0

p = F.softmax(logits, dim=1)
print([round(v, 3) for v in p[0].tolist()])   # [0.659, 0.242, 0.099]
print(round(-math.log(p[0, 0].item()), 3))             # 0.417
print(round(F.cross_entropy(logits, target).item(), 3))  # 0.417

wrong = torch.tensor([[-3.0, 5.0, 0.0]])   # confidently wrong
print(round(F.cross_entropy(wrong, target).item(), 3))   # 8.007

pred, y = torch.tensor([2.5, 0.0]), torch.tensor([3.0, 4.0])
print(F.mse_loss(pred, y).item())        # 8.125
print(F.l1_loss(pred, y).item())         # 2.25
print(round(math.log(10), 3))            # 2.303   chance level for 10 classes`,

"L3.5":{title:"Backpropagation in code",min:30,viz:"bpflow",
 why:"Autograd will do this for you, but a model you cannot debug is a model you cannot trust. Writing the backward pass once makes every gradient bug readable.",
 explain:[
  "In Layer 1 you applied the chain rule to a tiny network of single numbers. Real networks do the same with matrices. Run the forward pass and keep the intermediate values: Z = X @ W1, H = relu(Z), Y = H @ W2, then the loss.",
  "The backward pass walks the same steps in reverse. For a mean squared loss, dY = 2 (Y - T) / N. Then the gradient for W2 is H.T @ dY. The gradient flowing back into H is dY @ W2.T. The ReLU blocks it where Z was not positive: dZ = dH * (Z > 0). Finally the gradient for W1 is X.T @ dZ.",
  "Notice the pattern. Each forward matrix multiply has a matching backward one with transposes. Every gradient has exactly the shape of the parameter it belongs to, which makes shape a quick check.",
  "loss.backward() computes all of these for you and stores them in each parameter's .grad. The code below compares the hand-written version with autograd and they agree."],
 key:["Run forward and keep Z, H and Y. The backward pass reuses them.","dW = (input to the layer).T @ (gradient arriving at its output).","ReLU blocks the gradient wherever its input was not positive.","Every gradient has the same shape as its parameter."],
 code:`import torch

torch.manual_seed(0)
X = torch.randn(4, 3)
T = torch.randn(4, 1)
W1 = torch.randn(3, 5, requires_grad=True)
W2 = torch.randn(5, 1, requires_grad=True)

# forward
Z = X @ W1
H = torch.relu(Z)
Y = H @ W2
L = ((Y - T) ** 2).mean()

# backward by hand, using the stored forward values
dY = 2 * (Y - T) / 4
gW2 = H.T @ dY
dH = dY @ W2.T
dZ = dH * (Z > 0)
gW1 = X.T @ dZ

L.backward()                             # autograd does the same
print(torch.allclose(gW2, W2.grad), torch.allclose(gW1, W1.grad))   # True True
print(gW1.shape, gW2.shape)              # torch.Size([3, 5]) torch.Size([5, 1])`,
 out:"Both hand-computed gradients match autograd. Their shapes are (3, 5) and (5, 1), the same as W1 and W2.",
 watch:[R.micro,R.nn],
 check:[
  {q:"What is the gradient of the loss with respect to W2 in terms of H and dY?",a:"H.T @ dY: the transposed input to that layer times the gradient arriving at its output."},
  {q:"What does the ReLU do during the backward pass?",a:"It passes the gradient where its input was positive and blocks it (zero) where its input was not."},
  {q:"A gradient has shape (4, 5) but its parameter has shape (5, 4). What does that tell you?",a:"There is a shape or transpose bug. A gradient must have exactly the shape of its parameter."}],
 ex:"Add a bias b1 of shape (5,) to the first layer, so Z = X @ W1 + b1. Work out its gradient by hand (sum dZ over the batch) and confirm it against autograd.",
 teach:"Make learners write the shape of every tensor next to each line, forward and backward. The transposes then stop looking arbitrary."},

"L3.6":{title:"Optimizers: SGD, momentum, Adam",min:30,viz:"optim",
 why:"The optimizer decides how a gradient becomes an update. Adam versus plain SGD can be the difference between training in minutes and not converging.",
 explain:[
  "Gradient descent updates each weight by w = w - lr * gradient. With mini-batches it is called SGD, and the gradient is noisy because each batch is only a sample. On a loss shaped like a long narrow valley, SGD zig-zags across the steep walls and creeps along the valley floor.",
  "Momentum keeps a running velocity: v = beta * v + gradient, then w = w - lr * v. Steps in a consistent direction build up speed, while sideways zig-zags cancel out. The usual beta is 0.9.",
  "Adam adds a second running average, of the squared gradients. It divides each parameter's step by the square root of that average, so parameters with small or rare gradients get relatively larger steps. It also keeps a momentum term. A learning rate of 0.001 is a common starting point, and AdamW (Adam with decoupled weight decay) is the standard for transformers.",
  "In the narrow valley below, after 40 steps from the same start, SGD reaches a loss of 0.70, momentum 0.28 and Adam 0.088. Treat the optimizer as a setting to try, with Adam a strong default."],
 key:["SGD: w = w - lr * gradient. Noisy and slow in narrow valleys.","Momentum accumulates velocity so consistent directions speed up and zig-zags cancel.","Adam scales each parameter's step by its recent gradient size.","Adam with lr around 1e-3 is a strong default, and AdamW is standard for transformers."],
 code:`import torch

def run(make_opt, steps=40):
    w = torch.tensor([4.0, 1.0], requires_grad=True)
    opt = make_opt([w])
    for _ in range(steps):
        opt.zero_grad()
        loss = 0.5 * (w[0] ** 2 + 25 * w[1] ** 2)   # a narrow valley
        loss.backward()
        opt.step()
    return round((0.5 * (w[0] ** 2 + 25 * w[1] ** 2)).item(), 4)

print("sgd     ", run(lambda p: torch.optim.SGD(p, lr=0.03)))                 # 0.6996
print("momentum", run(lambda p: torch.optim.SGD(p, lr=0.03, momentum=0.9)))   # 0.2802
print("adam    ", run(lambda p: torch.optim.Adam(p, lr=0.3)))                 # 0.0878`,
 out:"All three start at the same point and take 40 steps. Momentum and Adam end far lower than SGD, because they handle the steep direction and the shallow direction better.",
 watch:[R3.mom,R3.optd],
 check:[
  {q:"What does momentum add to SGD?",a:"A running velocity of past gradients, so steps in a consistent direction build speed and sideways oscillations cancel."},
  {q:"Why does Adam help parameters with small gradients?",a:"It divides each step by the root of the recent squared gradient, so a parameter with small gradients takes relatively larger steps."},
  {q:"Which optimizer would you try first on a new problem?",a:"Adam (or AdamW) with a learning rate near 1e-3. It is forgiving and works well without much tuning."}],
 ex:"Change the valley to 0.5 * (w0**2 + 100 * w1**2) and rerun the three optimizers. Which one is hurt most, and what happens to SGD if you raise lr to 0.03?",
 teach:"Show the valley picture first. Learners see the zig-zag before they ever meet the momentum formula."},

"L3.7":{title:"Batches and epochs",min:20,viz:"batches",
 why:"Batch size and epoch count shape training speed, memory use and noise. These are the first knobs you will turn on every real model.",
 explain:[
  "A real dataset is too big to process in one go, so you feed it in batches. One pass over the whole dataset is an epoch. One update of the weights from one batch is an iteration (or step). With 1000 rows and a batch size of 64, an epoch takes 16 iterations, because 1000 / 64 rounds up to 16 and the last batch holds the 40 leftover rows.",
  "Total optimizer steps equal epochs times batches per epoch: 5 epochs of 16 batches is 80 steps. Training schedules and learning-rate schedules are usually counted in steps.",
  "Batch size is a trade-off. A larger batch gives a smoother gradient estimate and uses the hardware better, but needs more memory and gives fewer updates per epoch. A small batch is noisier, which can even help generalisation, but is slower per epoch. Typical sizes are 32 to 512 for images, and much larger for language models.",
  "Shuffle the training data every epoch so batches differ each time. torch.utils.data.DataLoader does the batching and shuffling for you. Do not shuffle validation data, because it makes no difference and just wastes time."],
 key:["Epoch: one pass over the data. Iteration: one update from one batch.","Steps per epoch = ceil(dataset size / batch size).","Bigger batches are smoother and faster per step but use more memory and give fewer updates.","Shuffle training data every epoch with DataLoader."],
 code:`import math
import torch
from torch.utils.data import DataLoader, TensorDataset

X = torch.arange(1000, dtype=torch.float32).reshape(-1, 1)
y = torch.zeros(1000)
data = TensorDataset(X, y)

loader = DataLoader(data, batch_size=64, shuffle=True,
                    generator=torch.Generator().manual_seed(0))
print(len(loader), math.ceil(1000 / 64))     # 16 16
sizes = [len(xb) for xb, _ in loader]
print(sizes[:3], sizes[-1])                  # [64, 64, 64] 40
print(5 * len(loader))                       # 80   optimizer steps in 5 epochs

xb, yb = next(iter(loader))
print(xb.shape, yb.shape)                    # torch.Size([64, 1]) torch.Size([64])`,
 out:"The loader makes 16 batches of 64, with a smaller final batch of 40, and 5 epochs are 80 optimizer steps.",
 watch:[R3.pt,R3.rec],
 check:[
  {q:"A dataset has 2500 rows and the batch size is 100. How many iterations in 4 epochs?",a:"25 iterations per epoch, so 100 in 4 epochs."},
  {q:"What is the difference between an epoch and an iteration?",a:"An epoch is one full pass over the data. An iteration is one weight update from one batch."},
  {q:"Name one effect of making the batch size much larger.",a:"The gradient estimate is smoother and the hardware is used better, but memory use rises and there are fewer updates per epoch."}],

"L3.8":{title:"Learning-rate schedules",min:20,viz:"lrsched",
 why:"The best learning rate changes during training. A good schedule often gives a better model for free, and transformers basically need warmup.",
 explain:[
  "A high learning rate makes fast progress early but bounces around near the end. A low one is stable but slow. A schedule starts with a larger rate and lowers it as training goes on.",
  "Step decay multiplies the rate by gamma every N epochs: 0.1, then 0.01, then 0.001. Cosine annealing lowers the rate smoothly from its starting value to near zero along a half cosine curve. Both are one-liners in torch.optim.lr_scheduler.",
  "Warmup does the opposite at the very start: the rate ramps up from a tiny value over the first few steps. Early gradients are unreliable and Adam's running averages are poorly estimated, so a full-size step too early can wreck the run. Transformers almost always use warmup followed by decay.",
  "Call scheduler.step() after optimizer.step(). Whether you call it once per epoch or once per batch depends on how the schedule was defined, so keep them consistent."],
 key:["Higher rate early, lower rate late.","StepLR drops the rate in jumps. CosineAnnealingLR lowers it smoothly.","Warmup ramps the rate up over the first steps and protects early training.","Call scheduler.step() after optimizer.step(), at the frequency the schedule expects."],
 code:`import torch

def lrs(make_sched, n):
    p = [torch.nn.Parameter(torch.zeros(1))]
    opt = torch.optim.SGD(p, lr=0.1)
    sch = make_sched(opt)
    out = []
    for _ in range(n):
        out.append(round(opt.param_groups[0]["lr"], 4))
        opt.step()
        sch.step()
    return out

step = lrs(lambda o: torch.optim.lr_scheduler.StepLR(o, step_size=10, gamma=0.1), 30)
print(step[0], step[9], step[10], step[20])      # 0.1 0.1 0.01 0.001

cos = lrs(lambda o: torch.optim.lr_scheduler.CosineAnnealingLR(o, T_max=100), 101)
print(cos[0], cos[50], cos[100])                 # 0.1 0.05 0.0

warm = lrs(lambda o: torch.optim.lr_scheduler.LambdaLR(o, lambda s: min(1.0, (s + 1) / 5)), 8)
print(warm)    # [0.02, 0.04, 0.06, 0.08, 0.1, 0.1, 0.1, 0.1]`,
 out:"Step decay drops tenfold at epochs 10 and 20. Cosine is exactly half the starting rate at the midpoint and reaches 0 at the end. The warmup list ramps up over 5 steps and then holds.",
 watch:[R3.optd,R3.fast],
 check:[
  {q:"Why use a larger learning rate early and a smaller one late?",a:"Large steps make quick progress at first. Small steps late let the weights settle into a minimum instead of bouncing around it."},
  {q:"What problem does warmup solve?",a:"Early gradients are noisy and optimizer statistics are unreliable, so a full-sized step too soon can destabilise training. Warmup ramps the rate up gently."},
  {q:"A StepLR with step_size=10 and gamma=0.5 starts at lr 0.2. What is the rate at epoch 25?",a:"It has dropped twice (at epochs 10 and 20), so 0.2 * 0.5 * 0.5 = 0.05."}],
 ex:"Combine warmup and cosine decay by writing one LambdaLR function: linear warmup over the first 10 steps, then cosine to zero by step 100. Print the rate at steps 0, 5, 10, 55 and 100.",
 teach:"Compare it to parking a car. You approach fast, then take smaller and smaller steps as you reach the spot."},
